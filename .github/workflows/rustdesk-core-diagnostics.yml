name: RustDesk Core Diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rustdesk-core-diagnostics
  cancel-in-progress: true

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Runner Lab
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Clone RustDesk Core Lab
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/aminsh35322088-ctrl/RustDesk-Core-Lab.git core-lab

      - name: Reconstruct pinned RustDesk source
        shell: bash
        run: |
          set -euo pipefail
          cd core-lab
          ./scripts/reconstruct-rustdesk.sh
          test "$(git -C rustdesk-research rev-parse HEAD)" = "$(cat rustdesk/UPSTREAM_SHA)"

      - name: Verify public-server auth hardening
        shell: bash
        run: |
          set -euo pipefail
          cd core-lab
          grep -q 'fn session_access_token' rustdesk-research/src/client.rs
          grep -q 'public_override_preserves_public_access_token' rustdesk-research/src/client.rs
          grep -q 'custom_override_never_receives_public_access_token' rustdesk-research/src/client.rs
          grep -q '#\[cfg(feature = "flutter")\]' rustdesk-research/src/hbbs_http.rs
          echo "Public token scoping and OIDC feature gate: OK"

      - name: Check RustDesk public account endpoint
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 10             https://admin.rustdesk.com/api/login-options             -o /tmp/rustdesk-login-options.json
          python3 - <<'PY'
          import json
          data = json.load(open('/tmp/rustdesk-login-options.json'))
          print('login-options endpoint: OK')
          print('response type:', type(data).__name__)
          PY

      - name: Probe public rendezvous pool
        shell: bash
        run: |
          set -euo pipefail
          cd core-lab
          python3 - <<'PY'
          import pathlib, re, socket, sys

          root = pathlib.Path('rustdesk-research')
          block = None
          source = None
          pattern = re.compile(r'RENDEZVOUS_SERVERS[^=]*=\s*&\[(.*?)\];', re.S)
          for path in root.rglob('*.rs'):
              text = path.read_text(errors='ignore')
              m = pattern.search(text)
              if m:
                  block = m.group(1)
                  source = path
                  break
          if block is None:
              raise SystemExit('RENDEZVOUS_SERVERS definition not found')

          servers = re.findall(r'"([^"]+)"', block)
          if not servers:
              raise SystemExit('public rendezvous pool is empty')

          print(f'pool source: {source}')
          print(f'candidates: {len(servers)}')
          reachable = []
          for raw in servers:
              host, port = raw, 21116
              if raw.count(':') == 1:
                  maybe_host, maybe_port = raw.rsplit(':', 1)
                  if maybe_port.isdigit():
                      host, port = maybe_host, int(maybe_port)
              try:
                  with socket.create_connection((host, port), timeout=5):
                      print(f'OK  {host}:{port}')
                      reachable.append((host, port))
              except OSError as exc:
                  print(f'ERR {host}:{port} {exc}')
          if not reachable:
              raise SystemExit('no public rendezvous endpoint reachable')
          print(f'reachable endpoints: {len(reachable)}/{len(servers)}')
          PY

      - name: Diagnostic summary
        if: always()
        shell: bash
        run: |
          {
            echo '## RustDesk Core Diagnostics'
            echo
            echo '- Canonical patch reconstruction: checked'
            echo '- Public-token scoping tests: checked'
            echo '- OIDC module remains feature-gated: checked'
            echo '- Public account endpoint: checked'
            echo '- Public rendezvous TCP pool: checked'
            echo
            echo '> This workflow intentionally stops before creating any remote-control session.'
          } >> "$GITHUB_STEP_SUMMARY"
