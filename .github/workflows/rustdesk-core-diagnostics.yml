name: RustDesk Core Diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rustdesk-core-diagnostics
  cancel-in-progress: true

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout RustDesk Core Lab
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: aminsh35322088-ctrl/RustDesk-Core-Lab
          path: core-lab
          fetch-depth: 1
          persist-credentials: false
          token: ${{ secrets.AGENT_GITHUB_TOKEN }}

      - name: Install RustDesk native build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ca-certificates clang cmake curl gcc g++ git make perl pkg-config libclang-dev llvm-dev nasm \
            libasound2-dev libunwind-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libgtk-3-dev libpulse-dev libva-dev libvdpau-dev libxcb-randr0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxdo-dev libxfixes-dev libdbus-1-dev libssl-dev \
            libyuv-dev libvpx-dev libopus-dev libaom-dev
          sudo mkdir -p /opt/rustdesk-pkgconfig
          sudo tee /opt/rustdesk-pkgconfig/libyuv.pc >/dev/null <<'PC'
          prefix=/usr
          exec_prefix=${prefix}
          libdir=/usr/lib/x86_64-linux-gnu
          includedir=/usr/include

          Name: libyuv
          Description: YUV conversion library
          Version: 0
          Libs: -L${libdir} -lyuv
          Cflags: -I${includedir}
          PC

      - name: Reconstruct pinned RustDesk source
        shell: bash
        run: |
          set -euo pipefail
          cd core-lab
          ./scripts/reconstruct-rustdesk.sh
          test "$(git -C rustdesk-research rev-parse HEAD)" = "$(tr -d '[:space:]' < rustdesk/UPSTREAM_SHA)"

      - name: Verify public-account routing contract
        shell: bash
        run: |
          set -euo pipefail
          cd core-lab
          grep -q 'public_server_uses_default_account_aware_rendezvous_path' rustdesk-research/src/headless_controller.rs
          grep -q 'self_hosted_server_remains_session_scoped' rustdesk-research/src/headless_controller.rs
          grep -q 'if id_server.trim().eq_ignore_ascii_case("public")' rustdesk-research/src/headless_controller.rs
          grep -q 'lc.other_server = None' rustdesk-research/src/headless_controller.rs
          grep -q '^pub mod account;' rustdesk-research/src/hbbs_http.rs
          grep -q 'headless_public_account_login_start' rustdesk-research/src/headless_controller.rs
          grep -q 'headless_public_account_status' rustdesk-research/src/headless_controller.rs
          grep -q 'saved_custom_manual_route_preserves_foojan_profile_and_secret_scope' bridge/src/main.rs
          if grep -q 

      - name: Run full Core and Bridge validation
        env:
          PKG_CONFIG_PATH: /opt/rustdesk-pkgconfig:/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/share/pkgconfig
        shell: bash
        run: |
          set -euo pipefail
          cd core-lab
          ./scripts/validate.sh

      - name: Check RustDesk public account endpoint
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 10 \
            https://admin.rustdesk.com/api/login-options \
            -o /tmp/rustdesk-login-options.json
          python3 - <<'PY'
          import json
          data = json.load(open('/tmp/rustdesk-login-options.json'))
          print('login-options endpoint: OK')
          print('response type:', type(data).__name__)
          PY

      - name: Probe public rendezvous pool
        shell: bash
        run: |
          set -euo pipefail
          cd core-lab
          python3 - <<'PY'
          import pathlib, re, socket

          root = pathlib.Path('rustdesk-research')
          pattern = re.compile(r'RENDEZVOUS_SERVERS[^=]*=\s*&\[(.*?)\];', re.S)
          block = source = None
          for path in root.rglob('*.rs'):
              text = path.read_text(errors='ignore')
              match = pattern.search(text)
              if match:
                  block, source = match.group(1), path
                  break
          if block is None:
              raise SystemExit('RENDEZVOUS_SERVERS definition not found')

          servers = re.findall(r'"([^"]+)"', block)
          if not servers:
              raise SystemExit('public rendezvous pool is empty')

          print(f'pool source: {source}')
          reachable = []
          for raw in servers:
              host, port = raw, 21116
              if raw.count(':') == 1:
                  maybe_host, maybe_port = raw.rsplit(':', 1)
                  if maybe_port.isdigit():
                      host, port = maybe_host, int(maybe_port)
              try:
                  with socket.create_connection((host, port), timeout=5):
                      print(f'OK  {host}:{port}')
                      reachable.append((host, port))
              except OSError as exc:
                  print(f'ERR {host}:{port} {exc}')
          if not reachable:
              raise SystemExit('no public rendezvous endpoint reachable')
          print(f'reachable endpoints: {len(reachable)}/{len(servers)}')
          PY

      - name: Diagnostic summary
        if: always()
        shell: bash
        run: |
          {
            echo '## RustDesk Core Diagnostics'
            echo
            echo '- Canonical patch clean reconstruction: checked'
            echo '- Public account-aware routing regression tests: checked'
            echo '- Core cargo check/tests: checked'
            echo '- Bridge fmt/check/tests/build: checked'
            echo '- Headless OIDC account module and Public login bridge: checked'
            echo '- Saved-custom/Foojan routing isolation regression: checked'
            echo '- Public account endpoint: checked'
            echo '- Public rendezvous TCP pool: checked'
            echo
            echo '> This workflow intentionally stops before creating any remote-control session.'
          } >> "$GITHUB_STEP_SUMMARY"
#[cfg(feature = "flutter")]\npub mod account;' rustdesk-research/src/hbbs_http.rs; then
            echo "OIDC account module is still Flutter-gated" >&2
            exit 1
          fi
          echo "Public account-aware routing, headless OIDC, and saved-custom isolation: OK"

      - name: Run full Core and Bridge validation
        env:
          PKG_CONFIG_PATH: /opt/rustdesk-pkgconfig:/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/share/pkgconfig
        shell: bash
        run: |
          set -euo pipefail
          cd core-lab
          ./scripts/validate.sh

      - name: Check RustDesk public account endpoint
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 10 \
            https://admin.rustdesk.com/api/login-options \
            -o /tmp/rustdesk-login-options.json
          python3 - <<'PY'
          import json
          data = json.load(open('/tmp/rustdesk-login-options.json'))
          print('login-options endpoint: OK')
          print('response type:', type(data).__name__)
          PY

      - name: Probe public rendezvous pool
        shell: bash
        run: |
          set -euo pipefail
          cd core-lab
          python3 - <<'PY'
          import pathlib, re, socket

          root = pathlib.Path('rustdesk-research')
          pattern = re.compile(r'RENDEZVOUS_SERVERS[^=]*=\s*&\[(.*?)\];', re.S)
          block = source = None
          for path in root.rglob('*.rs'):
              text = path.read_text(errors='ignore')
              match = pattern.search(text)
              if match:
                  block, source = match.group(1), path
                  break
          if block is None:
              raise SystemExit('RENDEZVOUS_SERVERS definition not found')

          servers = re.findall(r'"([^"]+)"', block)
          if not servers:
              raise SystemExit('public rendezvous pool is empty')

          print(f'pool source: {source}')
          reachable = []
          for raw in servers:
              host, port = raw, 21116
              if raw.count(':') == 1:
                  maybe_host, maybe_port = raw.rsplit(':', 1)
                  if maybe_port.isdigit():
                      host, port = maybe_host, int(maybe_port)
              try:
                  with socket.create_connection((host, port), timeout=5):
                      print(f'OK  {host}:{port}')
                      reachable.append((host, port))
              except OSError as exc:
                  print(f'ERR {host}:{port} {exc}')
          if not reachable:
              raise SystemExit('no public rendezvous endpoint reachable')
          print(f'reachable endpoints: {len(reachable)}/{len(servers)}')
          PY

      - name: Diagnostic summary
        if: always()
        shell: bash
        run: |
          {
            echo '## RustDesk Core Diagnostics'
            echo
            echo '- Canonical patch clean reconstruction: checked'
            echo '- Public account-aware routing regression tests: checked'
            echo '- Core cargo check/tests: checked'
            echo '- Bridge fmt/check/tests/build: checked'
            echo '- OIDC module remains feature-gated: checked'
            echo '- Public account endpoint: checked'
            echo '- Public rendezvous TCP pool: checked'
            echo
            echo '> This workflow intentionally stops before creating any remote-control session.'
          } >> "$GITHUB_STEP_SUMMARY"
