name: Repository Heartbeat

on:
  push:
    branches: [main]

  pull_request:

  schedule:
    - cron: '41 3 * * 0'

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-automation-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

jobs:
  regression:
    if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run Lab regression suite
        run: ./scripts/agent-run.sh selftest

      - name: Check shell script syntax
        shell: bash
        run: |
          set -uo pipefail
          status=0
          for file in scripts/*.sh .github/scripts/*.sh; do
            echo "bash -n ${file}"
            bash -n "${file}" || status=1
          done
          exit "${status}"

      - name: Byte-compile Python
        run: python3 -m compileall -q scripts tests .github/scripts

  heartbeat:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Keep scheduled workflows eligible
        shell: bash
        run: |
          set -euo pipefail
          LAST_COMMIT_TS="$(git log -1 --format=%ct)"
          NOW_TS="$(date +%s)"
          DAYS_SINCE=$(( (NOW_TS - LAST_COMMIT_TS) / 86400 ))
          echo "Days since last commit: $DAYS_SINCE"
          if [ "$DAYS_SINCE" -lt 30 ]; then
            exit 0
          fi
          mkdir -p .github/heartbeat
          date -u +"Last heartbeat: %Y-%m-%d %H:%M:%S UTC" > .github/heartbeat/last-run.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/heartbeat/last-run.txt
          git commit -m "chore: repository heartbeat"
          git push
