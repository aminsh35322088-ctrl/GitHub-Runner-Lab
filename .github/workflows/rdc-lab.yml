name: Remote Desktop Commander Lab

on:
  # Proven Exit-Node continuity model: self-handover is primary, schedule is only a backstop.
  schedule:
    - cron: '31 */6 * * *'

  workflow_dispatch:
    inputs:
      action:
        description: 'What do you want to do?'
        required: true
        default: 'Start / Resume'
        type: choice
        options:
          - 'Start / Resume'
          - 'Connect a new RDC account'

permissions:
  contents: write
  actions: write

env:
  ONLINE_MINUTES: 330
  AGENT_AUTO_HANDOFF_MINUTES: 20
  RDC_VERSION: 0.2.51
  TAILSCALE_HOSTNAME: GitHub-Lab

jobs:
  account-switch:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.action == 'Connect a new RDC account' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    concurrency:
      group: rdc-runner-lab
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.14.0'

      - name: Prepare scripts
        shell: bash
        run: chmod +x scripts/*.sh .github/scripts/*.sh

      - name: Validate RDC persistence secret
        env:
          RDC_STATE_KEY: ${{ secrets.RDC_STATE_KEY }}
        shell: bash
        run: |
          if [ ${#RDC_STATE_KEY} -lt 32 ]; then
            echo "::error::RDC_STATE_KEY is required and must contain at least 32 characters. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Install Remote Desktop Commander
        run: npm install --global "@wonderwhy-er/desktop-commander@$RDC_VERSION"

      - name: Safely stop the current RDC Lab
        env:
          GH_TOKEN: ${{ secrets.ACTIONS_WATCHDOG_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          SELF_RUN_ID: ${{ github.run_id }}
          WORKFLOW: rdc-lab.yml
        run: ./scripts/prepare-rdc-account-switch.sh

      - name: Authorize the new RDC account
        id: authorize
        run: ./scripts/bootstrap-rdc.sh

      - name: Start and verify the new RDC account
        id: verify
        shell: bash
        run: |
          ./scripts/start-rdc.sh
          ./scripts/health.sh
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Stop verification session
        if: steps.verify.outputs.ready == 'true'
        run: ./scripts/stop-rdc.sh

      - name: Commit the verified RDC account switch
        if: steps.verify.outputs.ready == 'true'
        env:
          RDC_STATE_KEY: ${{ secrets.RDC_STATE_KEY }}
        run: ./scripts/persist-rdc-state.sh

      - name: Start RDC Lab with the new account
        if: steps.verify.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.ACTIONS_WATCHDOG_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          SELF_RUN_ID: ${{ github.run_id }}
          REF: ${{ github.ref_name }}
          DISABLED: ${{ vars.RDC_LAB_DISABLED }}
        shell: bash
        run: |
          code=0
          bash .github/scripts/ensure-rdc-lab.sh || code=$?
          case "$code" in
            0|20|21) exit 0 ;;
            *) exit "$code" ;;
          esac

      - name: Restore service with the previous account after a failed switch
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.ACTIONS_WATCHDOG_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          SELF_RUN_ID: ${{ github.run_id }}
          REF: ${{ github.ref_name }}
          DISABLED: ${{ vars.RDC_LAB_DISABLED }}
        run: |
          ./scripts/stop-rdc.sh || true
          code=0
          bash .github/scripts/ensure-rdc-lab.sh || code=$?
          case "$code" in
            0|20|21) exit 0 ;;
            *) exit "$code" ;;
          esac

  runner-lab:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.action != 'Connect a new RDC account' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350

    concurrency:
      group: rdc-runner-lab
      cancel-in-progress: false

    outputs:
      configured: ${{ steps.verify.outputs.ready }}
      queued: ${{ steps.handover.outputs.queued }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.14.0'

      - name: Prepare scripts and initialize lifecycle clock
        shell: bash
        run: |
          chmod +x scripts/*.sh .github/scripts/*.sh
          ./scripts/agent-runtime.sh start "$ONLINE_MINUTES"

      - name: Validate RDC persistence secret
        env:
          RDC_STATE_KEY: ${{ secrets.RDC_STATE_KEY }}
        shell: bash
        run: |
          if [ ${#RDC_STATE_KEY} -lt 32 ]; then
            echo "::error::RDC_STATE_KEY is required and must contain at least 32 characters. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Restore latest RDC state
        id: restore
        env:
          RDC_STATE_KEY: ${{ secrets.RDC_STATE_KEY }}
        shell: bash
        run: |
          set +e
          ./scripts/restore-rdc-state.sh
          code=$?
          set -e
          case "$code" in
            0) echo "restored=true" >> "$GITHUB_OUTPUT" ;;
            3) echo "restored=false" >> "$GITHUB_OUTPUT" ;;
            *) exit "$code" ;;
          esac

      - name: Select startup mode
        id: mode
        env:
          STATE_RESTORED: ${{ steps.restore.outputs.restored }}
        shell: bash
        run: |
          echo "ready=true" >> "$GITHUB_OUTPUT"
          if [ "$STATE_RESTORED" = "true" ]; then
            echo "bootstrap=false" >> "$GITHUB_OUTPUT"
            echo "Persistent RDC state found; unattended auto-login enabled."
          else
            echo "bootstrap=true" >> "$GITHUB_OUTPUT"
            echo "No RDC account is connected yet; starting first-time authorization automatically."
          fi

      - name: Install Remote Desktop Commander
        if: steps.mode.outputs.ready == 'true'
        run: npm install --global "@wonderwhy-er/desktop-commander@$RDC_VERSION"

      - name: Authorize RDC account
        id: authorize
        if: steps.mode.outputs.bootstrap == 'true'
        run: ./scripts/bootstrap-rdc.sh

      - name: Start Remote Desktop Commander
        if: steps.mode.outputs.ready == 'true'
        run: ./scripts/start-rdc.sh

      - name: Verify connection
        id: verify
        if: steps.mode.outputs.ready == 'true'
        shell: bash
        run: |
          ./scripts/health.sh
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Persist verified first-time RDC identity
        if: steps.mode.outputs.bootstrap == 'true' && steps.verify.outputs.ready == 'true'
        env:
          RDC_STATE_KEY: ${{ secrets.RDC_STATE_KEY }}
        run: ./scripts/persist-rdc-state.sh

      - name: Validate Tailscale OAuth secrets
        if: steps.verify.outputs.ready == 'true'
        env:
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
        shell: bash
        run: |
          if [[ -z "${TS_OAUTH_CLIENT_ID:-}" || -z "${TS_OAUTH_SECRET:-}" ]]; then
            echo "::error::TS_OAUTH_CLIENT_ID and TS_OAUTH_SECRET are required to join the Tailnet."
            exit 1
          fi

      - name: Connect Tailscale
        if: steps.verify.outputs.ready == 'true'
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:exit,tag:ssh
          hostname: ${{ env.TAILSCALE_HOSTNAME }}
          version: latest
          use-cache: "false"
          args: --accept-dns=false

      - name: Enable and verify Tailscale SSH
        id: tailscale
        if: steps.verify.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo tailscale set --ssh

          READY=false
          for i in $(seq 1 12); do
            if tailscale status >/dev/null 2>&1; then
              READY=true
              break
            fi
            echo "Tailscale is not ready yet. Retry ${i}/12..."
            sleep 5
          done
          if [[ "$READY" != "true" ]]; then
            echo "::error::Tailscale did not become ready."
            exit 1
          fi

          sudo tailscale debug prefs | jq -e '.RunSSH == true' >/dev/null
          tailscale status --json | jq -e '(.Self.Online // false) == true' >/dev/null

          TS_IPV4="$(tailscale ip -4 | head -n1)"
          [[ -n "$TS_IPV4" ]]
          echo "ipv4=$TS_IPV4" >> "$GITHUB_OUTPUT"
          echo "ready=true" >> "$GITHUB_OUTPUT"
          {
            echo "### Tailscale"
            echo
            echo "- Status: connected"
            echo "- Hostname: `$TAILSCALE_HOSTNAME`"
            echo "- IPv4: `$TS_IPV4`"
            echo "- SSH: enabled"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "TAILSCALE_HEALTH=READY"
          echo "TAILSCALE_IPV4=$TS_IPV4"

      - name: Configure Agent GitHub access
        if: steps.mode.outputs.ready == 'true'
        env:
          AGENT_GITHUB_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN }}
        shell: bash
        run: |
          if [[ -z "${AGENT_GITHUB_TOKEN:-}" ]]; then
            echo "::error::AGENT_GITHUB_TOKEN is required for transparent Agent GitHub access."
            exit 1
          fi
          printf '%s' "$AGENT_GITHUB_TOKEN" | ./scripts/agent-github.sh install
          unset AGENT_GITHUB_TOKEN
          ./scripts/agent-github.sh verify

      # Restore dependency/download caches only after RDC is already reachable.
      # Target-repository setup scripts own the cache contents; the Lab only
      # persists this generic, secret-free cache between ephemeral runners.
      - name: Restore Agent Project Cache
        id: project-cache
        if: steps.mode.outputs.ready == 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/agent-projects
            ~/.npm
          key: agent-lab-projects-${{ runner.os }}-node22-${{ github.run_id }}
          restore-keys: |
            agent-lab-projects-${{ runner.os }}-node22-

      - name: Restore latest encrypted Agent checkpoint
        if: steps.mode.outputs.ready == 'true'
        continue-on-error: true
        env:
          RDC_STATE_KEY: ${{ secrets.RDC_STATE_KEY }}
        run: ./scripts/checkpoint-sync.sh restore

      # RDC is already healthy at this point. Keep the prewarm child in the
      # same long-lived step as keepalive so it cannot be reaped between steps.
      - name: Prewarm Agent Toolchain and Keep RDC Lab Alive
        if: steps.mode.outputs.ready == 'true'
        env:
          RDC_STATE_KEY: ${{ secrets.RDC_STATE_KEY }}
          GH_TOKEN: ${{ secrets.ACTIONS_WATCHDOG_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          SELF_RUN_ID: ${{ github.run_id }}
          REF: ${{ github.ref_name }}
          DISABLED: ${{ vars.RDC_LAB_DISABLED }}
        shell: bash
        run: |
          ./scripts/agent-prewarm.sh --background
          ./scripts/keepalive.sh "$ONLINE_MINUTES"

      # Same handover model as the proven Tailscale Exit Node: queue the successor
      # while this run still owns the concurrency group.
      - name: Queue Successor Run
        id: handover
        if: ${{ always() && steps.verify.outputs.ready == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.ACTIONS_WATCHDOG_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          SELF_RUN_ID: ${{ github.run_id }}
          REF: ${{ github.ref_name }}
          DISABLED: ${{ vars.RDC_LAB_DISABLED }}
        run: |
          set -uo pipefail
          code=0
          bash .github/scripts/ensure-rdc-lab.sh || code=$?
          if [ "$code" -eq 0 ]; then
            echo "queued=true" >> "$GITHUB_OUTPUT"
          elif [ "$code" -eq 20 ] || [ "$code" -eq 21 ]; then
            echo "queued=true" >> "$GITHUB_OUTPUT"
            echo "Handover intentionally suppressed by repository control (code $code)."
          else
            echo "queued=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Handover was not confirmed (code $code). The relaunch job/watchdog will retry."
          fi

      - name: Save final Agent checkpoint
        if: ${{ always() && steps.verify.outputs.ready == 'true' }}
        continue-on-error: true
        env:
          RDC_STATE_KEY: ${{ secrets.RDC_STATE_KEY }}
        run: ./scripts/checkpoint-sync.sh save finalizer

      - name: Upload Agent Checkpoint
        if: ${{ always() && steps.verify.outputs.ready == 'true' }}
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agent-checkpoint-${{ github.run_id }}
          path: .agent-artifacts/*.enc
          if-no-files-found: ignore
          retention-days: 7

      - name: Gracefully Stop RDC
        if: ${{ always() && steps.verify.outputs.ready == 'true' }}
        continue-on-error: true
        run: ./scripts/stop-rdc.sh

      - name: Persist final RDC state
        if: ${{ always() && steps.verify.outputs.ready == 'true' }}
        continue-on-error: true
        env:
          RDC_STATE_KEY: ${{ secrets.RDC_STATE_KEY }}
        run: ./scripts/persist-rdc-state.sh

      - name: Prune retained Agent data
        if: ${{ always() && steps.verify.outputs.ready == 'true' }}
        continue-on-error: true
        run: ./scripts/agent-run.sh cache --apply --days 14

      - name: Save Agent Project Cache
        if: ${{ always() && steps.verify.outputs.ready == 'true' }}
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/agent-projects
            ~/.npm
          key: agent-lab-projects-${{ runner.os }}-node22-${{ github.run_id }}

      - name: Remove optional Agent GitHub token
        if: ${{ always() && steps.verify.outputs.ready == 'true' }}
        continue-on-error: true
        run: ./scripts/agent-github.sh remove

  # Same fallback role as Exit Node's relaunch job.
  relaunch:
    needs: [runner-lab]
    if: ${{ always() && needs.runner-lab.outputs.configured == 'true' && needs.runner-lab.outputs.queued != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Ensure a Successor Exists
        env:
          GH_TOKEN: ${{ secrets.ACTIONS_WATCHDOG_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          WORKFLOW: rdc-lab.yml
          SELF_RUN_ID: ${{ github.run_id }}
          REF: ${{ github.ref_name }}
          DISABLED: ${{ vars.RDC_LAB_DISABLED }}
        shell: bash
        run: |
          code=0
          bash .github/scripts/ensure-rdc-lab.sh || code=$?
          case "$code" in
            0|20|21) exit 0 ;;
            *) exit "$code" ;;
          esac
