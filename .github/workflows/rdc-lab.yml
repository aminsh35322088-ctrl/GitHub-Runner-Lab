name: Remote Desktop Commander Lab

on:
  push:
    branches: [main]
    paths:
      - scripts/start-rdc.sh
      - scripts/install-rdc.sh
      - scripts/rdc-supervisor.mjs
      - scripts/health.sh
      - .github/workflows/rdc-lab.yml
  # Proven Exit-Node continuity model: self-handover is primary, schedule is only a backstop.
  schedule:
    - cron: '31 */6 * * *'

  workflow_dispatch:
    inputs:
      action:
        description: 'What do you want to do?'
        required: true
        default: 'Start / Resume'
        type: choice
        options:
          - 'Start / Resume'
          - 'Connect a new RDC account'
          - 'Vault smoke test'
          - 'Create Northflank credential link'

permissions:
  contents: write
  actions: write

env:
  ONLINE_MINUTES: 330
  AGENT_AUTO_HANDOFF_MINUTES: 20
  TAILSCALE_HOSTNAME: GitHub-Lab
  SIGILLO_PROJECT_ID: 01M6ZRTJGTG7RNMSMVMVRJB3HY
  SIGILLO_ENVIRONMENT: prod

jobs:
  account-switch:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.action == 'Connect a new RDC account' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    concurrency:
      group: rdc-runner-lab
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.22.2

      - name: Prepare scripts
        shell: bash
        run: chmod +x scripts/*.sh .github/scripts/*.sh

      - name: Validate RDC persistence secret
        env:
          RDC_STATE_KEY: ${{ secrets.RDC_STATE_KEY }}
        shell: bash
        run: |
          if [ ${#RDC_STATE_KEY} -lt 32 ]; then
            echo "::error::RDC_STATE_KEY is required and must contain at least 32 characters. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Install Remote Desktop Commander
        run: ./scripts/install-rdc.sh

      - name: Safely stop the current RDC Lab
        env:
          GH_TOKEN: ${{ secrets.ACTIONS_WATCHDOG_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          SELF_RUN_ID: ${{ github.run_id }}
          WORKFLOW: rdc-lab.yml
        run: ./scripts/prepare-rdc-account-switch.sh

      - name: Authorize the new RDC account
        id: authorize
        run: ./scripts/bootstrap-rdc.sh

      - name: Start and verify the new RDC account
        id: verify
        shell: bash
        run: |
          ./scripts/start-rdc.sh
          ./scripts/health.sh
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Stop verification session
        if: steps.verify.outputs.ready == 'true'
        run: ./scripts/stop-rdc.sh

      - name: Commit the verified RDC account switch
        if: steps.verify.outputs.ready == 'true'
        env:
          RDC_STATE_KEY: ${{ secrets.RDC_STATE_KEY }}
        run: ./scripts/persist-rdc-state.sh

      - name: Start RDC Lab with the new account
        if: steps.verify.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.ACTIONS_WATCHDOG_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          SELF_RUN_ID: ${{ github.run_id }}
          REF: ${{ github.ref_name }}
          DISABLED: ${{ vars.RDC_LAB_DISABLED }}
        shell: bash
        run: |
          code=0
          bash .github/scripts/ensure-rdc-lab.sh || code=$?
          case "$code" in
            0|20|21) exit 0 ;;
            *) exit "$code" ;;
          esac

      - name: Restore service with the previous account after a failed switch
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.ACTIONS_WATCHDOG_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          SELF_RUN_ID: ${{ github.run_id }}
          REF: ${{ github.ref_name }}
          DISABLED: ${{ vars.RDC_LAB_DISABLED }}
        run: |
          ./scripts/stop-rdc.sh || true
          code=0
          bash .github/scripts/ensure-rdc-lab.sh || code=$?
          case "$code" in
            0|20|21) exit 0 ;;
            *) exit "$code" ;;
          esac

  vault-smoke-test:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.action == 'Vault smoke test' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.22.2

      - name: Verify Sigillo API token (optional)
        id: sigillo-auth
        env:
          SIGILLO_TOKEN: ${{ secrets.SIGILLO_API_TOKEN }}
          SIGILLO_API_URL: ${{ vars.SIGILLO_API_URL }}
        shell: bash
        run: |
          set -euo pipefail

          report() {
            local status="$1"
            local detail="$2"
            unset SIGILLO_TOKEN
            echo "::notice::Sigillo smoke test: $status"
            {
              echo "### Sigillo API smoke test"
              echo
              echo "- Authentication: **$status**"
              echo "- Detail: $detail"
              echo "- Token values: **not logged**"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          }

          if [[ -z "${SIGILLO_TOKEN:-}" ]]; then
            report "not configured" "SIGILLO_API_TOKEN GitHub Actions secret is missing"
          fi

          if [[ -z "${SIGILLO_API_URL:-}" ]]; then
            SIGILLO_API_URL="https://sigillo.dev"
          fi
          if ! api_origin="$(SIGILLO_API_URL="$SIGILLO_API_URL" node -e 'const u = new URL(process.env.SIGILLO_API_URL); if (u.protocol !== "https:" || !u.hostname || u.username || u.password || u.pathname !== "/" || u.search || u.hash) process.exit(2); process.stdout.write(u.origin)')"; then
            report "invalid endpoint" "SIGILLO_API_URL must be an HTTPS origin"
          fi
          export SIGILLO_API_URL="$api_origin"

          if ! npm install --global sigillo >/dev/null 2>&1; then
            report "unavailable" "Sigillo CLI installation failed"
          fi

          auth_err="$RUNNER_TEMP/sigillo-smoke-auth.stderr"
          projects_file="$RUNNER_TEMP/sigillo-smoke-projects.txt"
          if ! SIGILLO_TOKEN="$SIGILLO_TOKEN" sigillo me >/dev/null 2>"$auth_err"; then
            http_status="$(grep -oE '\([0-9]{3}\)' "$auth_err" | tail -n1 | tr -d '()' || true)"
            rm -f "$auth_err" "$projects_file"
            report "rejected (HTTP ${http_status:-unknown})" "API did not accept the supplied token on $api_origin"
          fi
          rm -f "$auth_err"

          if ! SIGILLO_TOKEN="$SIGILLO_TOKEN" sigillo projects >"$projects_file" 2>"$auth_err"; then
            rm -f "$auth_err" "$projects_file"
            report "authenticated; project listing failed" "The API accepted the token, but project listing failed"
          fi

          if grep -Fqi -- "Amin-creditonal" "$projects_file"; then
            result="found"
          else
            result="not visible to this token"
          fi
          rm -f "$auth_err" "$projects_file"
          unset SIGILLO_TOKEN
          {
            echo "### Sigillo API smoke test"
            echo
            echo "- Authentication: **passed**"
            echo "- Project Amin-creditonal: **$result**"
            echo "- API endpoint: $api_origin"
            echo "- Token values: **not logged**"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "SIGILLO_API_AUTH=PASS"
          echo "SIGILLO_AMIN_CREDITONAL=$result"

      - name: Discover Vault deployment
        id: vault-discovery
        env:
          SIGILLO_TOKEN: ${{ secrets.SIGILLO_API_TOKEN }}
          SIGILLO_API_URL: ${{ vars.SIGILLO_API_URL || 'https://sigillo.dev' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${SIGILLO_TOKEN:-}" ]]; then
            python3 scripts/discover_vault.py
            exit 0
          fi
          if ! sigillo run --project "$SIGILLO_PROJECT_ID" --env "$SIGILLO_ENVIRONMENT" -- python3 scripts/discover_vault.py; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Private Vault discovery could not use Sigillo; Vault integration is disabled for this run."
          fi

      - name: Validate Vault configuration
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${VAULT_URL:-}" ]]; then
            echo "::error::No Vault deployment was discovered. Deploy the Vault first; its deploy workflow publishes deployment.json for the Lab to discover."
            exit 1
          fi
          if [[ ! "${VAULT_CLIENT_REPOSITORY:-}" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]*/[A-Za-z0-9][A-Za-z0-9_.-]*$ ]]; then
            echo "::error::The discovered Vault client repository must be in owner/name form."
            exit 1
          fi
          if [[ ! "${VAULT_CLIENT_REF:-}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The discovered Vault client revision must be an immutable 40-character commit SHA."
            exit 1
          fi
          python3 - <<'PYURL'
          import os
          from urllib.parse import urlparse
          u = urlparse(os.environ["VAULT_URL"])
          if u.scheme != "https" or not u.hostname or u.username or u.password or u.path not in ("", "/") or u.query or u.fragment:
              raise SystemExit("VAULT_URL must be an HTTPS origin with no path, query or credentials")
          PYURL

      - name: Fetch the pinned Vault client
        env:
          SIGILLO_TOKEN: ${{ secrets.SIGILLO_API_TOKEN }}
          SIGILLO_API_URL: ${{ vars.SIGILLO_API_URL || 'https://sigillo.dev' }}
        shell: bash
        run: sigillo run --project "$SIGILLO_PROJECT_ID" --env "$SIGILLO_ENVIRONMENT" -- ./scripts/fetch-vault-client.sh "$RUNNER_TEMP/vault.mjs"

      - name: Verify GitHub OIDC and read-only Vault registry access
        env:
          VAULT_SESSION_FILE: ${{ runner.temp }}/vault-session.json
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          client="$RUNNER_TEMP/vault.mjs"
          node "$client" list > "$RUNNER_TEMP/vault-registry.json"
          jq -e 'type == "array"' "$RUNNER_TEMP/vault-registry.json" >/dev/null
          count="$(jq 'length' "$RUNNER_TEMP/vault-registry.json")"
          {
            echo "### Safe credential metadata"
            echo
            echo "| Name | Service | Delivery | Validation | Lifetime | External |"
            echo "| --- | --- | --- | --- | --- | --- |"
            jq -r '.[] | "| \(.name) | \(.service) | \(.delivery) | \(.validation) | \(.lifetime) | \(.externallyManaged) |"' "$RUNNER_TEMP/vault-registry.json"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          # Exercise both saved provider credentials through the Vault proxy.
          # Raw responses stay in runner-temp files; only boolean outcomes reach logs.
          node "$client" use GITHUB_API_TOKEN GET https://api.github.com/user             > "$RUNNER_TEMP/vault-github-check.json"
          jq -e 'type == "object" and (.login | type == "string") and (.id | type == "number")'             "$RUNNER_TEMP/vault-github-check.json" >/dev/null
          # Try the User Token endpoint first, then the Account Token endpoint.
          # The account identifier is repository metadata; no credential value or raw response is logged.
          set +e
          node "$client" use CLOUDFLARE_API_TOKEN GET https://api.cloudflare.com/client/v4/user/tokens/verify --purpose "read-only token verification" \
            > "$RUNNER_TEMP/vault-cloudflare-user-check.json" 2> "$RUNNER_TEMP/vault-cloudflare-user.stderr"
          cf_user_exit=$?
          set -e
          cf_token_type=""
          if [[ "$cf_user_exit" -eq 0 ]] && jq -e '.success == true and .result.status == "active"' "$RUNNER_TEMP/vault-cloudflare-user-check.json" >/dev/null; then
            cf_token_type="User API Token"
          else
            account_id="${CLOUDFLARE_ACCOUNT_ID:-}"
            if [[ ! "$account_id" =~ ^[a-fA-F0-9]{32}$ ]]; then
              echo "::error::User Token verification did not pass and CLOUDFLARE_ACCOUNT_ID is missing or malformed."
              exit 1
            fi
            set +e
            node "$client" use CLOUDFLARE_API_TOKEN GET "https://api.cloudflare.com/client/v4/accounts/${account_id}/tokens/verify" --purpose "read-only account token verification" \
              > "$RUNNER_TEMP/vault-cloudflare-account-check.json" 2> "$RUNNER_TEMP/vault-cloudflare-account.stderr"
            cf_account_exit=$?
            set -e
            if [[ "$cf_account_exit" -eq 0 ]] && jq -e '.success == true and .result.status == "active"' "$RUNNER_TEMP/vault-cloudflare-account-check.json" >/dev/null; then
              cf_token_type="Account API Token"
            else
              cf_user_status="$(sed -n 's/^vault: upstream status \\([0-9][0-9][0-9]\\)$/\\1/p' "$RUNNER_TEMP/vault-cloudflare-user.stderr" | tail -n1)"
              cf_account_status="$(sed -n 's/^vault: upstream status \\([0-9][0-9][0-9]\\)$/\\1/p' "$RUNNER_TEMP/vault-cloudflare-account.stderr" | tail -n1)"
              echo "::error::Cloudflare verification failed: User endpoint HTTP ${cf_user_status:-unknown}; Account endpoint HTTP ${cf_account_status:-unknown}. Raw responses and credential values were not logged."
              exit 1
            fi
          fi
          echo "CLOUDFLARE_TOKEN_TYPE=$cf_token_type"

          {
            echo "## Runner Credential Vault end-to-end smoke test"
            echo
            echo "- GitHub OIDC token exchange: **success**"
            echo "- Vault runner session: **success**"
            echo "- Read-only credential registry: **success ($count visible entries)**"
            echo "- GitHub API credential proxy: **success**"
            echo "- Cloudflare API credential proxy: **success ($cf_token_type)**"
            echo "- Secret values logged or returned to summary: **never**"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "VAULT_OIDC_SMOKE_TEST=PASS"
          echo "VAULT_GITHUB_PROXY=PASS"
          echo "VAULT_CLOUDFLARE_PROXY=PASS"

  runner-lab:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.action == 'Start / Resume' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350

    concurrency:
      group: rdc-runner-lab
      cancel-in-progress: false

    # The Vault is optional and needs no Lab-side configuration: the
    # vault-discovery step below reads deployment.json from the Vault
    # repository and exports VAULT_URL / VAULT_CLIENT_REPOSITORY /
    # VAULT_CLIENT_REF for the rest of the job (including the RDC process,
    # which inherits this job's environment at launch) only when a Vault is
    # actually deployed.

    # A job-level block replaces the workflow-level one, so the two existing
    # permissions are repeated. `id-token: write` only lets this job REQUEST a GitHub
    # OIDC token (used to authenticate to the Runner Credential Vault); it grants no
    # access to repository contents or secrets. The runner exposes its OIDC requester
    # variables to this job's steps; RDC inherits them at launch, while the later Vault
    # CLI connection writes the session into the same runner-private cache for reuse.
    # This lets RDC and Tailscale become healthy before optional Vault network work.
    permissions:
      contents: write
      actions: write
      id-token: write

    outputs:
      configured: ${{ steps.verify.outputs.ready }}
      queued: ${{ steps.handover.outputs.queued }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.22.2

      # Authenticate non-interactively with the long-lived Sigillo API token.
      # Validate the supplied token BEFORE replacing any saved runner credential:
      # `sigillo login` only stores a bearer token; it does not validate it.
      # The optional Sigillo integration must never block RDC/Tailscale startup.
      - name: Install and authenticate Sigillo CLI (optional)
        id: sigillo
        env:
          SIGILLO_TOKEN: ${{ secrets.SIGILLO_API_TOKEN }}
          # Optional override for self-hosted Sigillo; defaults to https://sigillo.dev.
          SIGILLO_API_URL: ${{ vars.SIGILLO_API_URL }}
        shell: bash
        run: |
          set -euo pipefail

          # Normalize to a credential-safe HTTPS origin. The CLI sends the
          # bearer token to this URL, so credentials, paths, queries and HTTP
          # endpoints are deliberately rejected.
          if [[ -z "${SIGILLO_API_URL:-}" ]]; then
            SIGILLO_API_URL="https://sigillo.dev"
          fi
          if ! sigillo_api_origin="$(SIGILLO_API_URL="$SIGILLO_API_URL" node -e 'const u = new URL(process.env.SIGILLO_API_URL); if (u.protocol !== "https:" || !u.hostname || u.username || u.password || u.pathname !== "/" || u.search || u.hash) process.exit(2); process.stdout.write(u.origin)')"; then
            echo "::warning::SIGILLO_API_URL must be a valid HTTPS origin without credentials, path, query, or fragment."
            echo "SIGILLO_CLI_READY=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          export SIGILLO_API_URL="$sigillo_api_origin"

          sigillo_unavailable() {
            local reason="$1"
            if [[ -n "${auth_err:-}" ]]; then rm -f "$auth_err" || true; fi
            echo "::warning::Sigillo unavailable: $reason. RDC/Tailscale startup will continue."
            echo "SIGILLO_CLI_READY=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Sigillo authentication"
              echo
              echo "- Status: **unavailable**"
              echo "- Reason: $reason"
              echo "- Runner connectivity: **not blocked**"
              echo "- Credential values: **not logged**"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          }

          # Keep unexpected optional-integration errors from failing the lab.
          on_unexpected_failure() {
            local code=$?
            trap - ERR
            sigillo_unavailable "bootstrap command failed (exit code $code)"
          }
          trap on_unexpected_failure ERR

          if [[ -z "${SIGILLO_TOKEN:-}" ]]; then
            sigillo_unavailable "SIGILLO_API_TOKEN GitHub Actions secret is missing"
          fi

          if ! npm install --global sigillo; then
            sigillo_unavailable "CLI installation failed"
          fi

          umask 077
          mkdir -p "$HOME/.sigillo"
          chmod 700 "$HOME/.sigillo"

          # A successful `login` command only writes the token to config.
          # Probe the API with the supplied secret first so a malformed, revoked,
          # wrong-instance, or otherwise unknown token can never be marked ready.
          auth_err="$RUNNER_TEMP/sigillo-auth-check.stderr"
          if ! SIGILLO_TOKEN="$SIGILLO_TOKEN" sigillo me >/dev/null 2>"$auth_err"; then
            http_status="$(grep -oE '\([0-9]{3}\)' "$auth_err" | tail -n1 | tr -d '()' || true)"
            case "${http_status:-unknown}" in
              401) sigillo_unavailable "Sigillo rejected SIGILLO_API_TOKEN on ${sigillo_api_origin} (HTTP 401); check the instance URL or replace the GitHub secret with an active API token created on that instance" ;;
              403) sigillo_unavailable "Sigillo denied SIGILLO_API_TOKEN (HTTP 403); check the token and its project/environment access" ;;
              *) sigillo_unavailable "API token preflight failed (HTTP ${http_status:-unknown})" ;;
            esac
          fi
          rm -f "$auth_err"

          # Persist only after the preflight succeeded. The CLI writes config
          # atomically with owner-only permissions; no token is passed in argv.
          if ! SIGILLO_TOKEN="$SIGILLO_TOKEN" sigillo login --scope / >/dev/null 2>"$auth_err"; then
            unset SIGILLO_TOKEN
            sigillo_unavailable "could not persist the validated API token"
          fi
          unset SIGILLO_TOKEN

          if ! chmod 700 "$HOME/.sigillo" ||
             ! chmod 600 "$HOME/.sigillo/config.json" ||
             ! sigillo me >/dev/null 2>"$auth_err"; then
            sigillo_unavailable "saved credential did not pass post-login API verification"
          fi
          rm -f "$auth_err"

          echo "SIGILLO_CLI_READY=true" >> "$GITHUB_OUTPUT"
          {
            echo "### Sigillo authentication"
            echo
            echo "- Status: **ready**"
            echo "- Authentication: **GitHub Actions API secret (non-interactive)**"
            echo "- API verification: **passed**"
            echo "- Config permissions: **700/600**"
            echo "- Credential values: **not logged**"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Sigillo API authentication verified; no interactive login required."


      - name: Discover Vault deployment
        id: vault-discovery
        env:
          SIGILLO_TOKEN: ${{ secrets.SIGILLO_API_TOKEN }}
          SIGILLO_API_URL: ${{ vars.SIGILLO_API_URL || 'https://sigillo.dev' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${SIGILLO_TOKEN:-}" ]]; then
            python3 scripts/discover_vault.py
            exit 0
          fi
          if ! sigillo run --project "$SIGILLO_PROJECT_ID" --env "$SIGILLO_ENVIRONMENT" -- python3 scripts/discover_vault.py; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Private Vault discovery could not use Sigillo; Vault integration is disabled for this run."
          fi

      - name: Prepare scripts and initialize lifecycle clock
        shell: bash
        run: |
          chmod +x scripts/*.sh .github/scripts/*.sh
          ./scripts/agent-runtime.sh start "$ONLINE_MINUTES"
          mkdir -p "$HOME/.local/bin"
          ln -sfn "$GITHUB_WORKSPACE/scripts/agent-run.sh" "$HOME/.local/bin/agent-lab"
          cp AGENTS.md "$HOME/AGENTS.md"

      - name: Validate RDC persistence secret
        env:
          RDC_STATE_KEY: ${{ secrets.RDC_STATE_KEY }}
        shell: bash
        run: |
          if [ ${#RDC_STATE_KEY} -lt 32 ]; then
            echo "::error::RDC_STATE_KEY is required and must contain at least 32 characters. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Restore latest RDC state
        id: restore
        env:
          RDC_STATE_KEY: ${{ secrets.RDC_STATE_KEY }}
        shell: bash
        run: |
          set +e
          ./scripts/restore-rdc-state.sh
          code=$?
          set -e
          case "$code" in
            0) echo "restored=true" >> "$GITHUB_OUTPUT" ;;
            3) echo "restored=false" >> "$GITHUB_OUTPUT" ;;
            *) exit "$code" ;;
          esac

      - name: Select startup mode
        id: mode
        env:
          STATE_RESTORED: ${{ steps.restore.outputs.restored }}
        shell: bash
        run: |
          echo "ready=true" >> "$GITHUB_OUTPUT"
          if [ "$STATE_RESTORED" = "true" ]; then
            echo "bootstrap=false" >> "$GITHUB_OUTPUT"
            echo "Persistent RDC state found; unattended auto-login enabled."
          else
            echo "bootstrap=true" >> "$GITHUB_OUTPUT"
            echo "No RDC account is connected yet; starting first-time authorization automatically."
          fi

      - name: Install Remote Desktop Commander
        if: steps.mode.outputs.ready == 'true'
        run: ./scripts/install-rdc.sh

      - name: Authorize RDC account
        id: authorize
        if: steps.mode.outputs.bootstrap == 'true'
        run: ./scripts/bootstrap-rdc.sh

      - name: Start Remote Desktop Commander
        if: steps.mode.outputs.ready == 'true'
        run: ./scripts/start-rdc.sh

      - name: Verify connection
        id: verify
        if: steps.mode.outputs.ready == 'true'
        shell: bash
        run: |
          ./scripts/health.sh
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Persist verified first-time RDC identity
        if: steps.mode.outputs.bootstrap == 'true' && steps.verify.outputs.ready == 'true'
        env:
          RDC_STATE_KEY: ${{ secrets.RDC_STATE_KEY }}
        run: ./scripts/persist-rdc-state.sh

      - name: Validate Tailscale OAuth secrets
        if: steps.verify.outputs.ready == 'true'
        env:
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
        shell: bash
        run: |
          if [[ -z "${TS_OAUTH_CLIENT_ID:-}" || -z "${TS_OAUTH_SECRET:-}" ]]; then
            echo "::error::TS_OAUTH_CLIENT_ID and TS_OAUTH_SECRET are required to join the Tailnet."
            exit 1
          fi

      - name: Connect Tailscale
        if: steps.verify.outputs.ready == 'true'
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ssh,tag:co-admin
          hostname: ${{ env.TAILSCALE_HOSTNAME }}
          version: 1.104.5
          use-cache: "false"
          args: --accept-dns=false

      - name: Normalize root SSH sessions to runner
        if: steps.verify.outputs.ready == 'true'
        shell: bash
        run: bash ./scripts/configure-ssh-user-alias.sh

      - name: Enable and verify Tailscale SSH
        id: tailscale
        if: steps.verify.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo tailscale set --ssh

          READY=false
          for i in $(seq 1 12); do
            if tailscale status >/dev/null 2>&1; then
              READY=true
              break
            fi
            echo "Tailscale is not ready yet. Retry ${i}/12..."
            sleep 5
          done
          if [[ "$READY" != "true" ]]; then
            echo "::error::Tailscale did not become ready."
            exit 1
          fi

          sudo tailscale debug prefs | jq -e '.RunSSH == true' >/dev/null
          tailscale status --json | jq -e '(.Self.Online // false) == true' >/dev/null

          TS_IPV4="$(tailscale ip -4 | head -n1)"
          [[ -n "$TS_IPV4" ]]
          echo "ipv4=$TS_IPV4" >> "$GITHUB_OUTPUT"
          echo "ready=true" >> "$GITHUB_OUTPUT"
          {
            echo "### Tailscale"
            echo
            echo "- Status: connected"
            echo "- Hostname: $TAILSCALE_HOSTNAME"
            echo "- IPv4: $TS_IPV4"
            echo "- SSH: enabled"
            echo "- SSH root compatibility: redirects to runner"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "TAILSCALE_HEALTH=READY"
          echo "TAILSCALE_IPV4=$TS_IPV4"

      - name: Install Runner Credential Vault client
        id: vault-client
        if: steps.verify.outputs.ready == 'true' && steps.tailscale.outputs.ready == 'true' && steps.vault-discovery.outputs.configured == 'true'
        timeout-minutes: 2
        continue-on-error: true
        env:
          SIGILLO_TOKEN: ${{ secrets.SIGILLO_API_TOKEN }}
          SIGILLO_API_URL: ${{ vars.SIGILLO_API_URL || 'https://sigillo.dev' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYURL'
          import os
          from urllib.parse import urlparse
          u = urlparse(os.environ["VAULT_URL"])
          if u.scheme != "https" or not u.hostname or u.username or u.password or u.path not in ("", "/") or u.query or u.fragment:
              raise SystemExit("VAULT_URL must be an HTTPS origin with no path, query or credentials")
          PYURL
          mkdir -p "$HOME/.local/share/runner-vault" "$HOME/.local/bin"
          chmod 700 "$HOME/.local/share/runner-vault" "$HOME/.local/bin"
          sigillo run --project "$SIGILLO_PROJECT_ID" --env "$SIGILLO_ENVIRONMENT" -- ./scripts/fetch-vault-client.sh "$HOME/.local/share/runner-vault/vault.mjs"
          chmod 500 "$HOME/.local/share/runner-vault/vault.mjs"
          ln -sfn "$HOME/.local/share/runner-vault/vault.mjs" "$HOME/.local/bin/vault"
          test -x "$HOME/.local/bin/vault"
          echo "VAULT_CLIENT_INSTALLED=true"

      - name: Connect runner to Credential Vault
        id: vault-connect
        if: steps.vault-client.outcome == 'success'
        timeout-minutes: 1
        continue-on-error: true
        env:
          VAULT_REQUEST_TIMEOUT_MS: '5000'
        shell: bash
        run: |
          set -Eeuo pipefail
          registry="$RUNNER_TEMP/vault-registry.json"
          if node "$HOME/.local/share/runner-vault/vault.mjs" list > "$registry" &&
             jq -e 'type == "array"' "$registry" >/dev/null; then
            count="$(jq 'length' "$registry")"
            echo "VAULT_OIDC_CONNECTION=READY"
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "VAULT_VISIBLE_CREDENTIALS=$count"
            {
              echo "### Credential Vault connection"
              echo
              echo "- GitHub OIDC exchange: **success**"
              echo "- Short-lived runner session: **issued**"
              echo "- Metadata-only registry read: **success**"
              echo "- Visible credentials: **$count**"
              echo "- Secret values exposed: **never**"
              echo
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Credential Vault connection failed; RDC and Tailscale will continue without Vault."
            echo "VAULT_OIDC_CONNECTION=DEGRADED"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify Vault environment reached RDC
        id: vault-runtime
        if: steps.verify.outputs.ready == 'true' && steps.tailscale.outputs.ready == 'true'
        continue-on-error: true
        env:
          VAULT_CONNECT_STATE: ${{ steps.vault-connect.outputs.ready }}
        run: ./scripts/verify-vault-runtime.sh

      - name: Report Vault verifier failure without blocking connectivity
        if: steps.verify.outputs.ready == 'true' && steps.vault-runtime.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning::Vault runtime verification failed unexpectedly. Vault operations remain unavailable, but RDC and Tailscale startup are independent and will continue."
          {
            echo "### Credential Vault"
            echo
            echo "- Status: **DEGRADED**"
            echo "- The runtime verifier did not complete; this does not block RDC or Tailscale."
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Configure Agent GitHub access from Sigillo
        if: steps.mode.outputs.ready == 'true'
        env:
          SIGILLO_TOKEN: ${{ secrets.SIGILLO_API_TOKEN }}
          SIGILLO_API_URL: ${{ vars.SIGILLO_API_URL || 'https://sigillo.dev' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${SIGILLO_TOKEN:-}" ]]; then
            echo "::error::SIGILLO_API_TOKEN is required to retrieve the runner GitHub credential from Sigillo."
            exit 1
          fi
          # Keep the GitHub PAT out of the installer process environment: it is
          # delivered only over stdin, then stored by GitHub CLI's credential helper.
          sigillo run --project "$SIGILLO_PROJECT_ID" --env "$SIGILLO_ENVIRONMENT" --command 'set -o pipefail; printf "%s" "${GITHUB_API_TOKEN:?GITHUB_API_TOKEN is missing from Sigillo}" | env -u GITHUB_API_TOKEN ./scripts/agent-github.sh install'
          ./scripts/agent-github.sh verify
      - name: Identify Agent cache runtime
        id: cache-runtime
        if: steps.mode.outputs.ready == 'true'
        run: echo "key=$(python3 scripts/lab_environment.py --cache-key)" >> "$GITHUB_OUTPUT"

      - name: Restore Agent Project Cache
        id: project-cache
        if: steps.mode.outputs.ready == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/agent-projects
            ~/.npm
          key: agent-lab-projects-v2-${{ runner.os }}-${{ steps.cache-runtime.outputs.key }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            agent-lab-projects-v2-${{ runner.os }}-${{ steps.cache-runtime.outputs.key }}-

      - name: Restore latest encrypted Agent checkpoint
        if: steps.mode.outputs.ready == 'true'
        continue-on-error: true
        env:
          RDC_STATE_KEY: ${{ secrets.RDC_STATE_KEY }}
        run: ./scripts/checkpoint-sync.sh restore

      # RDC is already healthy at this point. Keep the prewarm child in the
      # same long-lived step as keepalive so it cannot be reaped between steps.
      - name: Prewarm Agent Toolchain and Keep RDC Lab Alive
        if: steps.mode.outputs.ready == 'true'
        env:
          RDC_STATE_KEY: ${{ secrets.RDC_STATE_KEY }}
          GH_TOKEN: ${{ secrets.ACTIONS_WATCHDOG_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          SELF_RUN_ID: ${{ github.run_id }}
          REF: ${{ github.ref_name }}
          DISABLED: ${{ vars.RDC_LAB_DISABLED }}
        shell: bash
        run: |
          # Prewarm and keepalive do not mint Vault sessions. Keep the job-scoped
          # OIDC requester capability out of their process trees.
          unset ACTIONS_ID_TOKEN_REQUEST_URL ACTIONS_ID_TOKEN_REQUEST_TOKEN
          ./scripts/agent-prewarm.sh --background
          ./scripts/keepalive.sh "$ONLINE_MINUTES"

      # Remove the ephemeral node before any successor is released. The action's
      # post hook repeats logout as a second cleanup layer, but this early step
      # protects normal handoff and cancellation from stale MagicDNS entries.
      - name: Disconnect Tailscale before handoff
        id: tailscale_cleanup
        if: ${{ always() && steps.tailscale.outputs.ready == 'true' }}
        shell: bash
        run: ./scripts/stop-tailscale.sh

      # Same handover model as the proven Tailscale Exit Node: queue the successor
      # while this run still owns the concurrency group.
      - name: Queue Successor Run
        id: handover
        if: ${{ always() && steps.verify.outputs.ready == 'true' && (steps.tailscale.outputs.ready != 'true' || steps.tailscale_cleanup.outcome == 'success') }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.ACTIONS_WATCHDOG_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          SELF_RUN_ID: ${{ github.run_id }}
          REF: ${{ github.ref_name }}
          DISABLED: ${{ vars.RDC_LAB_DISABLED }}
        run: |
          set -uo pipefail
          code=0
          bash .github/scripts/ensure-rdc-lab.sh || code=$?
          if [ "$code" -eq 0 ]; then
            echo "queued=true" >> "$GITHUB_OUTPUT"
          elif [ "$code" -eq 20 ] || [ "$code" -eq 21 ]; then
            echo "queued=true" >> "$GITHUB_OUTPUT"
            echo "Handover intentionally suppressed by repository control (code $code)."
          else
            echo "queued=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Handover was not confirmed (code $code). The relaunch job/watchdog will retry."
          fi

      - name: Save final Agent checkpoint
        if: ${{ always() && steps.verify.outputs.ready == 'true' }}
        continue-on-error: true
        env:
          RDC_STATE_KEY: ${{ secrets.RDC_STATE_KEY }}
        run: ./scripts/checkpoint-sync.sh save finalizer

      - name: Upload Agent Checkpoint
        if: ${{ always() && steps.verify.outputs.ready == 'true' }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-checkpoint-${{ github.run_id }}
          path: .agent-artifacts/*.enc
          if-no-files-found: ignore
          retention-days: 7

      - name: Gracefully Stop RDC
        if: ${{ always() && steps.verify.outputs.ready == 'true' }}
        continue-on-error: true
        run: ./scripts/stop-rdc.sh

      - name: Persist final RDC state
        if: ${{ always() && steps.verify.outputs.ready == 'true' }}
        continue-on-error: true
        env:
          RDC_STATE_KEY: ${{ secrets.RDC_STATE_KEY }}
        run: ./scripts/persist-rdc-state.sh

      - name: Prune retained Agent data
        if: ${{ always() && steps.verify.outputs.ready == 'true' }}
        continue-on-error: true
        run: ./scripts/agent-run.sh cache --apply --days 14

      - name: Save Agent Project Cache
        if: ${{ always() && steps.verify.outputs.ready == 'true' }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/agent-projects
            ~/.npm
          key: agent-lab-projects-v2-${{ runner.os }}-${{ steps.cache-runtime.outputs.key }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Remove optional Agent GitHub token
        if: ${{ always() && steps.verify.outputs.ready == 'true' }}
        continue-on-error: true
        run: ./scripts/agent-github.sh remove

  # Same fallback role as Exit Node's relaunch job.
  relaunch:
    needs: [runner-lab]
    if: ${{ always() && needs.runner-lab.outputs.configured == 'true' && needs.runner-lab.outputs.queued != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Ensure a Successor Exists
        env:
          GH_TOKEN: ${{ secrets.ACTIONS_WATCHDOG_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          WORKFLOW: rdc-lab.yml
          SELF_RUN_ID: ${{ github.run_id }}
          REF: ${{ github.ref_name }}
          DISABLED: ${{ vars.RDC_LAB_DISABLED }}
        shell: bash
        run: |
          code=0
          bash .github/scripts/ensure-rdc-lab.sh || code=$?
          case "$code" in
            0|20|21) exit 0 ;;
            *) exit "$code" ;;
          esac

  northflank-credential-link:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.action == 'Create Northflank credential link' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.22.2

      - name: Install Sigillo CLI
        run: npm install --global sigillo

      - name: Discover Vault deployment
        id: vault-discovery
        env:
          SIGILLO_TOKEN: ${{ secrets.SIGILLO_API_TOKEN }}
          SIGILLO_API_URL: ${{ vars.SIGILLO_API_URL || 'https://sigillo.dev' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${SIGILLO_TOKEN:-}" ]]; then
            python3 scripts/discover_vault.py
            exit 0
          fi
          if ! sigillo run --project "$SIGILLO_PROJECT_ID" --env "$SIGILLO_ENVIRONMENT" -- python3 scripts/discover_vault.py; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Private Vault discovery could not use Sigillo; Vault integration is disabled for this run."
          fi

      - name: Report missing Vault deployment
        if: steps.vault-discovery.outputs.configured != 'true'
        shell: bash
        run: |
          echo "No Vault deployment was discovered, so there is no Vault to link a Northflank credential to."
          echo "Deploy the Vault first; its deploy workflow publishes deployment.json for the Lab to discover."

      - name: Fetch the pinned Vault client
        if: steps.vault-discovery.outputs.configured == 'true'
        env:
          SIGILLO_TOKEN: ${{ secrets.SIGILLO_API_TOKEN }}
          SIGILLO_API_URL: ${{ vars.SIGILLO_API_URL || 'https://sigillo.dev' }}
        shell: bash
        run: sigillo run --project "$SIGILLO_PROJECT_ID" --env "$SIGILLO_ENVIRONMENT" -- ./scripts/fetch-vault-client.sh "$RUNNER_TEMP/vault.mjs"

      - name: Create one-time Northflank credential registration
        if: steps.vault-discovery.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/northflank-doc.json" <<'JSON'
          {
            "overview": "Store a Northflank API token in Runner Vault for authenticated Northflank API access.",
            "task": "Use Northflank CLI and API operations from the Runner environment.",
            "token_type": "Northflank personal, team, or organization API token",
            "creation_link": {
              "title": "Northflank API access and token documentation",
              "url": "https://northflank.com/docs/v1/application/secure/grant-api-access"
            },
            "creation_steps": [
              "Open API tokens in the relevant Northflank team or organization settings.",
              "Create an API token and select an RBAC role with only the permissions required for your tasks.",
              "Choose a team-scoped token for one team, or an organization-scoped token only if cross-team access is required.",
              "Choose an appropriate expiry and copy the token when Northflank displays it."
            ],
            "required_permissions": [
              {
                "name": "Northflank API access",
                "level": "Only the operations needed for the intended CLI tasks",
                "why": "The token inherits its permissions from the selected RBAC role."
              }
            ],
            "unnecessary_permissions": [
              "Unrelated organization administration",
              "Access to teams or resources not needed by the Runner"
            ],
            "security_notes": [
              "Never paste the token into chat, a repository, or workflow logs.",
              "The token secret is displayed only once by Northflank.",
              "Use a team-scoped token unless cross-team operations are explicitly required."
            ],
            "expiration_guidance": [
              "Prefer a short lifetime and rotate the token when it expires."
            ],
            "official_documentation_links": [
              {
                "title": "Northflank API authentication and token scope",
                "url": "https://northflank.com/docs/v1/api/use-the-api"
              },
              {
                "title": "Northflank CLI",
                "url": "https://northflank.com/docs/v1/api/use-the-cli"
              }
            ],
            "verification": "verified"
          }
          JSON
          node "$RUNNER_TEMP/vault.mjs" request --name NORTHFLANK_API_TOKEN --service Northflank --doc "$RUNNER_TEMP/northflank-doc.json"
