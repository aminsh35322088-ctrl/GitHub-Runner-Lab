name: Remote Desktop Commander Lab

on:
  # Proven Exit-Node continuity model: self-handover is primary, schedule is only a backstop.
  schedule:
    - cron: '31 */6 * * *'

  workflow_dispatch:
    inputs:
      bootstrap:
        description: 'One-time RDC account authorization (use only for first setup/recovery)'
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  actions: write

concurrency:
  group: rdc-runner-lab
  cancel-in-progress: false

env:
  ONLINE_MINUTES: 330

jobs:
  runner-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    outputs:
      configured: ${{ steps.mode.outputs.ready }}
      queued: ${{ steps.handover.outputs.queued }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'

      - name: Prepare scripts
        run: chmod +x scripts/*.sh .github/scripts/*.sh

      - name: Check persistent state key
        id: key
        env:
          RDC_STATE_KEY: ${{ secrets.RDC_STATE_KEY }}
        shell: bash
        run: |
          if [ ${#RDC_STATE_KEY} -ge 32 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Create repository secret RDC_STATE_KEY with at least 32 random characters."
          fi

      - name: Restore latest RDC state
        id: restore
        if: steps.key.outputs.ready == 'true'
        env:
          RDC_STATE_KEY: ${{ secrets.RDC_STATE_KEY }}
        shell: bash
        run: |
          set +e
          ./scripts/restore-rdc-state.sh
          code=$?
          set -e
          case "$code" in
            0) echo "restored=true" >> "$GITHUB_OUTPUT" ;;
            3) echo "restored=false" >> "$GITHUB_OUTPUT" ;;
            *) exit "$code" ;;
          esac

      - name: Select startup mode
        id: mode
        env:
          KEY_READY: ${{ steps.key.outputs.ready }}
          STATE_RESTORED: ${{ steps.restore.outputs.restored }}
          BOOTSTRAP_REQUESTED: ${{ inputs.bootstrap || 'false' }}
        shell: bash
        run: |
          if [ "$KEY_READY" != "true" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "bootstrap=false" >> "$GITHUB_OUTPUT"
          elif [ "$STATE_RESTORED" = "true" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "bootstrap=false" >> "$GITHUB_OUTPUT"
            echo "Persistent RDC state found; unattended auto-login enabled."
          elif [ "$BOOTSTRAP_REQUESTED" = "true" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "bootstrap=true" >> "$GITHUB_OUTPUT"
            echo "No RDC state exists yet; entering one-time account authorization."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "bootstrap=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No RDC state exists yet. Run this workflow manually once with bootstrap=true."
          fi

      - name: Install Remote Desktop Commander
        if: steps.mode.outputs.ready == 'true'
        run: npm install --global @wonderwhy-er/desktop-commander@latest

      - name: One-time RDC account authorization
        if: steps.mode.outputs.bootstrap == 'true'
        run: ./scripts/bootstrap-rdc.sh

      - name: Persist bootstrap identity
        if: steps.mode.outputs.bootstrap == 'true'
        env:
          RDC_STATE_KEY: ${{ secrets.RDC_STATE_KEY }}
        run: ./scripts/persist-rdc-state.sh

      - name: Start Remote Desktop Commander
        if: steps.mode.outputs.ready == 'true'
        run: ./scripts/start-rdc.sh

      - name: Verify connection
        if: steps.mode.outputs.ready == 'true'
        run: ./scripts/health.sh

      # RDC is already healthy at this point. Keep the prewarm child in the
      # same long-lived step as keepalive so it cannot be reaped between steps.
      - name: Prewarm Agent Toolchain and Keep RDC Lab Alive
        if: steps.mode.outputs.ready == 'true'
        env:
          RDC_STATE_KEY: ${{ secrets.RDC_STATE_KEY }}
        shell: bash
        run: |
          ./scripts/agent-prewarm.sh --background
          ./scripts/keepalive.sh "$ONLINE_MINUTES"

      # Same handover model as the proven Tailscale Exit Node: queue the successor
      # while this run still owns the concurrency group.
      - name: Queue Successor Run
        id: handover
        if: ${{ always() && steps.mode.outputs.ready == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.ACTIONS_WATCHDOG_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          SELF_RUN_ID: ${{ github.run_id }}
          REF: ${{ github.ref_name }}
          DISABLED: ${{ vars.RDC_LAB_DISABLED }}
        run: |
          set -uo pipefail
          if bash .github/scripts/ensure-rdc-lab.sh; then
            echo "queued=true" >> "$GITHUB_OUTPUT"
          else
            echo "queued=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Handover failed. The relaunch job/watchdog will retry."
          fi

      - name: Gracefully Stop RDC
        if: ${{ always() && steps.mode.outputs.ready == 'true' }}
        continue-on-error: true
        run: ./scripts/stop-rdc.sh

      - name: Persist final RDC state
        if: ${{ always() && steps.mode.outputs.ready == 'true' }}
        continue-on-error: true
        env:
          RDC_STATE_KEY: ${{ secrets.RDC_STATE_KEY }}
        run: ./scripts/persist-rdc-state.sh

  # Same fallback role as Exit Node's relaunch job.
  relaunch:
    needs: [runner-lab]
    if: ${{ always() && needs.runner-lab.outputs.configured == 'true' && needs.runner-lab.outputs.queued != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure a Successor Exists
        env:
          GH_TOKEN: ${{ secrets.ACTIONS_WATCHDOG_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          WORKFLOW: rdc-lab.yml
          SELF_RUN_ID: ${{ github.run_id }}
          REF: ${{ github.ref_name }}
          DISABLED: ${{ vars.RDC_LAB_DISABLED }}
        run: bash .github/scripts/ensure-rdc-lab.sh
