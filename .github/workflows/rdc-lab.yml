name: Remote Desktop Commander Lab

on:
  push:
    branches: [main]
    paths:
      - scripts/start-rdc.sh
      - scripts/install-rdc.sh
      - scripts/rdc-supervisor.mjs
      - scripts/health.sh
      - .github/workflows/rdc-lab.yml
  # Proven Exit-Node continuity model: self-handover is primary, schedule is only a backstop.
  schedule:
    - cron: '31 */6 * * *'

  workflow_dispatch:
    inputs:
      action:
        description: 'What do you want to do?'
        required: true
        default: 'Start / Resume'
        type: choice
        options:
          - 'Start / Resume'
          - 'Connect a new RDC account'
          - 'Sigillo smoke test'

permissions:
  contents: write
  actions: write

env:
  ONLINE_MINUTES: 330
  AGENT_AUTO_HANDOFF_MINUTES: 20
  TAILSCALE_HOSTNAME: GitHub-Lab
  SIGILLO_PROJECT_ID: 01M6ZRTJGTG7RNMSMVMVRJB3HY
  SIGILLO_ENVIRONMENT: prod

jobs:
  account-switch:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.action == 'Connect a new RDC account' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    concurrency:
      group: rdc-runner-lab
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.22.2

      - name: Prepare scripts
        shell: bash
        run: chmod +x scripts/*.sh .github/scripts/*.sh

      - name: Validate RDC persistence secret
        env:
          RDC_STATE_KEY: ${{ secrets.RDC_STATE_KEY }}
        shell: bash
        run: |
          if [ ${#RDC_STATE_KEY} -lt 32 ]; then
            echo "::error::RDC_STATE_KEY is required and must contain at least 32 characters. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Install Remote Desktop Commander
        run: ./scripts/install-rdc.sh

      - name: Safely stop the current RDC Lab
        env:
          GH_TOKEN: ${{ secrets.ACTIONS_WATCHDOG_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          SELF_RUN_ID: ${{ github.run_id }}
          WORKFLOW: rdc-lab.yml
        run: ./scripts/prepare-rdc-account-switch.sh

      - name: Authorize the new RDC account
        id: authorize
        run: ./scripts/bootstrap-rdc.sh

      - name: Start and verify the new RDC account
        id: verify
        shell: bash
        run: |
          ./scripts/start-rdc.sh
          ./scripts/health.sh
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Stop verification session
        if: steps.verify.outputs.ready == 'true'
        run: ./scripts/stop-rdc.sh

      - name: Commit the verified RDC account switch
        if: steps.verify.outputs.ready == 'true'
        env:
          RDC_STATE_KEY: ${{ secrets.RDC_STATE_KEY }}
        run: ./scripts/persist-rdc-state.sh

      - name: Start RDC Lab with the new account
        if: steps.verify.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.ACTIONS_WATCHDOG_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          SELF_RUN_ID: ${{ github.run_id }}
          REF: ${{ github.ref_name }}
          DISABLED: ${{ vars.RDC_LAB_DISABLED }}
        shell: bash
        run: |
          code=0
          bash .github/scripts/ensure-rdc-lab.sh || code=$?
          case "$code" in
            0|20|21) exit 0 ;;
            *) exit "$code" ;;
          esac

      - name: Restore service with the previous account after a failed switch
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.ACTIONS_WATCHDOG_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          SELF_RUN_ID: ${{ github.run_id }}
          REF: ${{ github.ref_name }}
          DISABLED: ${{ vars.RDC_LAB_DISABLED }}
        run: |
          ./scripts/stop-rdc.sh || true
          code=0
          bash .github/scripts/ensure-rdc-lab.sh || code=$?
          case "$code" in
            0|20|21) exit 0 ;;
            *) exit "$code" ;;
          esac

  sigillo-smoke-test:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.action == 'Sigillo smoke test' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.22.2

      - name: Verify Sigillo API token
        id: sigillo-auth
        env:
          SIGILLO_TOKEN: ${{ secrets.SIGILLO_API_TOKEN }}
          SIGILLO_API_URL: ${{ vars.SIGILLO_API_URL }}
        shell: bash
        run: |
          set -euo pipefail

          report() {
            local status="$1"
            local detail="$2"
            unset SIGILLO_TOKEN
            echo "::notice::Sigillo smoke test: $status"
            {
              echo "### Sigillo API smoke test"
              echo
              echo "- Authentication: **$status**"
              echo "- Detail: $detail"
              echo "- Token values: **not logged**"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          }

          if [[ -z "${SIGILLO_TOKEN:-}" ]]; then
            report "not configured" "SIGILLO_API_TOKEN GitHub Actions secret is missing"
          fi

          if [[ -z "${SIGILLO_API_URL:-}" ]]; then
            SIGILLO_API_URL="https://sigillo.dev"
          fi
          if ! api_origin="$(SIGILLO_API_URL="$SIGILLO_API_URL" node -e 'const u = new URL(process.env.SIGILLO_API_URL); if (u.protocol !== "https:" || !u.hostname || u.username || u.password || u.pathname !== "/" || u.search || u.hash) process.exit(2); process.stdout.write(u.origin)')"; then
            report "invalid endpoint" "SIGILLO_API_URL must be an HTTPS origin"
          fi
          export SIGILLO_API_URL="$api_origin"

          if ! npm install --global sigillo >/dev/null 2>&1; then
            report "unavailable" "Sigillo CLI installation failed"
          fi

          auth_err="$RUNNER_TEMP/sigillo-smoke-auth.stderr"
          projects_file="$RUNNER_TEMP/sigillo-smoke-projects.txt"
          if ! SIGILLO_TOKEN="$SIGILLO_TOKEN" sigillo me >/dev/null 2>"$auth_err"; then
            http_status="$(grep -oE '\([0-9]{3}\)' "$auth_err" | tail -n1 | tr -d '()' || true)"
            rm -f "$auth_err" "$projects_file"
            report "rejected (HTTP ${http_status:-unknown})" "API did not accept the supplied token on $api_origin"
          fi
          rm -f "$auth_err"

          if ! SIGILLO_TOKEN="$SIGILLO_TOKEN" sigillo projects >"$projects_file" 2>"$auth_err"; then
            rm -f "$auth_err" "$projects_file"
            report "authenticated; project listing failed" "The API accepted the token, but project listing failed"
          fi

          if grep -Fqi -- "Amin-creditonal" "$projects_file"; then
            result="found"
          else
            result="not visible to this token"
          fi
          rm -f "$auth_err" "$projects_file"
          unset SIGILLO_TOKEN
          {
            echo "### Sigillo API smoke test"
            echo
            echo "- Authentication: **passed**"
            echo "- Project Amin-creditonal: **$result**"
            echo "- API endpoint: $api_origin"
            echo "- Token values: **not logged**"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "SIGILLO_API_AUTH=PASS"
          echo "SIGILLO_AMIN_CREDITONAL=$result"

      - name: Verify Agent GitHub credential from Sigillo
        env:
          SIGILLO_TOKEN: ${{ secrets.SIGILLO_API_TOKEN }}
          SIGILLO_API_URL: ${{ vars.SIGILLO_API_URL || 'https://sigillo.dev' }}
        shell: bash
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          chmod 700 "$tmpdir"
          export GH_CONFIG_DIR="$tmpdir/gh"
          export DOCKER_CONFIG="$tmpdir/docker"
          export AGENT_GITHUB_DOCKER_HELPER="$tmpdir/docker-credential-github-cli"
          export AGENT_GITHUB_JOB_GIT_CONFIG="$tmpdir/github-auth.gitconfig"
          mkdir -p "$GH_CONFIG_DIR" "$DOCKER_CONFIG"
          trap 'rm -rf "$tmpdir"' EXIT

          # Exercise the exact host bootstrap path without a repository PAT secret.
          # Sigillo injects the token into the child; the installer receives stdin only.
          # shellcheck disable=SC2016 # Sigillo evaluates this command in its child shell.
          sigillo run --project "$SIGILLO_PROJECT_ID" --env "$SIGILLO_ENVIRONMENT" --command 'set -o pipefail; printf "%s" "${GITHUB_API_TOKEN:?GITHUB_API_TOKEN is missing from Sigillo}" | env -u GITHUB_API_TOKEN ./scripts/agent-github.sh install'
          ./scripts/agent-github.sh verify
          ./scripts/agent-github.sh remove
          echo "AGENT_GITHUB_SIGILLO_SMOKE=PASS"

  runner-lab:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.action == 'Start / Resume' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350

    concurrency:
      group: rdc-runner-lab
      cancel-in-progress: false

    outputs:
      configured: ${{ steps.verify.outputs.ready }}
      queued: ${{ steps.handover.outputs.queued }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.22.2

      # Authenticate non-interactively with the long-lived Sigillo API token.
      # Validate the supplied token BEFORE replacing any saved runner credential:
      # `sigillo login` only stores a bearer token; it does not validate it.
      # A temporary Sigillo failure must not block RDC/Tailscale startup; Agent GitHub bootstrap fails closed later.
      - name: Install and authenticate Sigillo CLI
        id: sigillo
        env:
          SIGILLO_TOKEN: ${{ secrets.SIGILLO_API_TOKEN }}
          # Optional override for self-hosted Sigillo; defaults to https://sigillo.dev.
          SIGILLO_API_URL: ${{ vars.SIGILLO_API_URL }}
        shell: bash
        run: |
          set -euo pipefail

          state_file="$HOME/.local/state/agent-runner/sigillo-auth-status"
          write_sigillo_state() {
            local state="$1"
            local state_dir tmp
            state_dir="$(dirname "$state_file")"
            mkdir -p "$state_dir"
            chmod 755 "$state_dir"
            tmp="${state_file}.tmp.$$"
            printf '%s\n' "$state" > "$tmp"
            chmod 644 "$tmp"
            mv -f "$tmp" "$state_file"
          }

          sigillo_unavailable() {
            local state="$1"
            local reason="$2"
            if [[ -n "${auth_err:-}" ]]; then rm -f "$auth_err" || true; fi
            write_sigillo_state "$state" || echo "::warning::Could not persist the non-secret Sigillo status marker."
            echo "::warning::Sigillo unavailable: $reason. RDC/Tailscale startup will continue."
            echo "SIGILLO_CLI_READY=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Sigillo authentication"
              echo
              if [[ "$state" == "UNCONFIGURED" ]]; then
                echo "- Status: **not configured (optional)**"
              else
                echo "- Status: **authentication unavailable**"
              fi
              echo "- Reason: $reason"
              echo "- Runner connectivity: **not blocked**"
              echo "- Credential values: **not logged**"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          }

          # No API token means Sigillo is simply disabled for this runner generation.
          if [[ -z "${SIGILLO_TOKEN:-}" ]]; then
            sigillo_unavailable "UNCONFIGURED" "SIGILLO_API_TOKEN GitHub Actions secret is not set"
          fi

          # Mark configured-but-not-yet-verified as unavailable until every auth check passes.
          write_sigillo_state "AUTH_FAILED" || true

          # Keep unexpected optional-integration errors from failing the lab.
          on_unexpected_failure() {
            local code=$?
            trap - ERR
            sigillo_unavailable "AUTH_FAILED" "bootstrap command failed (exit code $code)"
          }
          trap on_unexpected_failure ERR

          # Normalize to a credential-safe HTTPS origin. The CLI sends the
          # bearer token to this URL, so credentials, paths, queries and HTTP
          # endpoints are deliberately rejected.
          if [[ -z "${SIGILLO_API_URL:-}" ]]; then
            SIGILLO_API_URL="https://sigillo.dev"
          fi
          if ! sigillo_api_origin="$(SIGILLO_API_URL="$SIGILLO_API_URL" node -e 'const u = new URL(process.env.SIGILLO_API_URL); if (u.protocol !== "https:" || !u.hostname || u.username || u.password || u.pathname !== "/" || u.search || u.hash) process.exit(2); process.stdout.write(u.origin)')"; then
            sigillo_unavailable "AUTH_FAILED" "SIGILLO_API_URL must be a valid HTTPS origin without credentials, path, query, or fragment"
          fi
          export SIGILLO_API_URL="$sigillo_api_origin"
          # Preserve the validated, non-secret API origin for RDC shells and Agent processes.
          printf 'SIGILLO_API_URL=%s\n' "$sigillo_api_origin" >> "$GITHUB_ENV"

          if ! npm install --global sigillo; then
            sigillo_unavailable "AUTH_FAILED" "CLI installation failed"
          fi

          umask 077
          mkdir -p "$HOME/.sigillo"
          chmod 700 "$HOME/.sigillo"

          # Validate the supplied token before persisting it. Never log CLI output.
          auth_err="$RUNNER_TEMP/sigillo-auth-check.stderr"
          if ! SIGILLO_TOKEN="$SIGILLO_TOKEN" sigillo me >/dev/null 2>"$auth_err"; then
            http_status="$(grep -oE '\([0-9]{3}\)' "$auth_err" | tail -n1 | tr -d '()' || true)"
            case "${http_status:-unknown}" in
              401) sigillo_unavailable "AUTH_FAILED" "Sigillo rejected SIGILLO_API_TOKEN (HTTP 401); check the instance URL or replace the GitHub secret with an active API token from that instance" ;;
              403) sigillo_unavailable "AUTH_FAILED" "Sigillo denied SIGILLO_API_TOKEN (HTTP 403); check token access to the required project/environment" ;;
              *) sigillo_unavailable "AUTH_FAILED" "API token preflight failed (HTTP ${http_status:-unknown})" ;;
            esac
          fi
          rm -f "$auth_err"

          # Persist only after preflight succeeds; the token is never passed in argv.
          if ! SIGILLO_TOKEN="$SIGILLO_TOKEN" sigillo login --scope / >/dev/null 2>"$auth_err"; then
            unset SIGILLO_TOKEN
            sigillo_unavailable "AUTH_FAILED" "could not persist the validated API token"
          fi
          unset SIGILLO_TOKEN

          if ! chmod 700 "$HOME/.sigillo" ||
             ! chmod 600 "$HOME/.sigillo/config.json" ||
             ! sigillo me >/dev/null 2>"$auth_err"; then
            sigillo_unavailable "AUTH_FAILED" "saved credential did not pass post-login API verification"
          fi
          rm -f "$auth_err"
          write_sigillo_state "AUTHENTICATED" || echo "::warning::Sigillo is authenticated, but Tool Center could not persist its status marker; live verification will be used."

          echo "SIGILLO_CLI_READY=true" >> "$GITHUB_OUTPUT"
          {
            echo "### Sigillo authentication"
            echo
            echo "- Status: **authenticated and available to Agent shells**"
            echo "- Authentication: **GitHub Actions API secret (non-interactive)**"
            echo "- API verification: **passed**"
            echo "- Config permissions: **700/600**"
            echo "- Credential values: **not logged**"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Sigillo API authentication verified; shared runner shells can use sigillo and sigillo run."

      - name: Prepare scripts and initialize lifecycle clock
        shell: bash
        run: |
          chmod +x scripts/*.sh .github/scripts/*.sh
          ./scripts/agent-runtime.sh start "$ONLINE_MINUTES"
          mkdir -p "$HOME/.local/bin"
          ln -sfn "$GITHUB_WORKSPACE/scripts/agent-run.sh" "$HOME/.local/bin/agent-lab"
          cp AGENTS.md "$HOME/AGENTS.md"

      - name: Validate RDC persistence secret
        env:
          RDC_STATE_KEY: ${{ secrets.RDC_STATE_KEY }}
        shell: bash
        run: |
          if [ ${#RDC_STATE_KEY} -lt 32 ]; then
            echo "::error::RDC_STATE_KEY is required and must contain at least 32 characters. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Restore latest RDC state
        id: restore
        env:
          RDC_STATE_KEY: ${{ secrets.RDC_STATE_KEY }}
        shell: bash
        run: |
          set +e
          ./scripts/restore-rdc-state.sh
          code=$?
          set -e
          case "$code" in
            0) echo "restored=true" >> "$GITHUB_OUTPUT" ;;
            3) echo "restored=false" >> "$GITHUB_OUTPUT" ;;
            *) exit "$code" ;;
          esac

      - name: Select startup mode
        id: mode
        env:
          STATE_RESTORED: ${{ steps.restore.outputs.restored }}
        shell: bash
        run: |
          echo "ready=true" >> "$GITHUB_OUTPUT"
          if [ "$STATE_RESTORED" = "true" ]; then
            echo "bootstrap=false" >> "$GITHUB_OUTPUT"
            echo "Persistent RDC state found; unattended auto-login enabled."
          else
            echo "bootstrap=true" >> "$GITHUB_OUTPUT"
            echo "No RDC account is connected yet; starting first-time authorization automatically."
          fi

      - name: Install Remote Desktop Commander
        if: steps.mode.outputs.ready == 'true'
        run: ./scripts/install-rdc.sh

      - name: Authorize RDC account
        id: authorize
        if: steps.mode.outputs.bootstrap == 'true'
        run: ./scripts/bootstrap-rdc.sh

      - name: Start Remote Desktop Commander
        if: steps.mode.outputs.ready == 'true'
        run: ./scripts/start-rdc.sh

      - name: Verify connection
        id: verify
        if: steps.mode.outputs.ready == 'true'
        shell: bash
        run: |
          ./scripts/health.sh
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Persist verified first-time RDC identity
        if: steps.mode.outputs.bootstrap == 'true' && steps.verify.outputs.ready == 'true'
        env:
          RDC_STATE_KEY: ${{ secrets.RDC_STATE_KEY }}
        run: ./scripts/persist-rdc-state.sh

      - name: Validate Tailscale OAuth secrets
        if: steps.verify.outputs.ready == 'true'
        env:
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
        shell: bash
        run: |
          if [[ -z "${TS_OAUTH_CLIENT_ID:-}" || -z "${TS_OAUTH_SECRET:-}" ]]; then
            echo "::error::TS_OAUTH_CLIENT_ID and TS_OAUTH_SECRET are required to join the Tailnet."
            exit 1
          fi

      - name: Connect Tailscale
        if: steps.verify.outputs.ready == 'true'
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ssh,tag:co-admin
          hostname: ${{ env.TAILSCALE_HOSTNAME }}
          version: 1.104.5
          use-cache: "false"
          args: --accept-dns=false

      - name: Normalize root SSH sessions to runner
        if: steps.verify.outputs.ready == 'true'
        shell: bash
        run: bash ./scripts/configure-ssh-user-alias.sh

      - name: Enable and verify Tailscale SSH
        id: tailscale
        if: steps.verify.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo tailscale set --ssh

          READY=false
          for i in $(seq 1 12); do
            if tailscale status >/dev/null 2>&1; then
              READY=true
              break
            fi
            echo "Tailscale is not ready yet. Retry ${i}/12..."
            sleep 5
          done
          if [[ "$READY" != "true" ]]; then
            echo "::error::Tailscale did not become ready."
            exit 1
          fi

          sudo tailscale debug prefs | jq -e '.RunSSH == true' >/dev/null
          tailscale status --json | jq -e '(.Self.Online // false) == true' >/dev/null

          TS_IPV4="$(tailscale ip -4 | head -n1)"
          [[ -n "$TS_IPV4" ]]
          echo "ipv4=$TS_IPV4" >> "$GITHUB_OUTPUT"
          echo "ready=true" >> "$GITHUB_OUTPUT"
          {
            echo "### Tailscale"
            echo
            echo "- Status: connected"
            echo "- Hostname: $TAILSCALE_HOSTNAME"
            echo "- IPv4: $TS_IPV4"
            echo "- SSH: enabled"
            echo "- SSH root compatibility: redirects to runner"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "TAILSCALE_HEALTH=READY"
          echo "TAILSCALE_IPV4=$TS_IPV4"

      - name: Configure Agent GitHub access from Sigillo
        id: agent-github-auth
        if: ${{ steps.mode.outputs.ready == 'true' && steps.sigillo.outputs.SIGILLO_CLI_READY == 'true' }}
        continue-on-error: true
        env:
          SIGILLO_API_URL: ${{ vars.SIGILLO_API_URL || 'https://sigillo.dev' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          on_failure() {
            local code=$?
            trap - ERR
            echo "::warning::Agent GitHub credential bootstrap failed (exit code $code); the authenticated Sigillo CLI remains available to Agent shells."
            {
              echo "### Agent GitHub credential"
              echo
              echo "- Status: **unavailable**"
              echo "- Sigillo CLI: **authenticated and still available**"
              echo "- Runner startup: **not blocked**"
              echo "- Credential values: **not logged**"
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$code"
          }
          trap on_failure ERR
          # The token is already saved with owner-only permissions by the auth step.
          # Keep the GitHub PAT out of the installer process environment: it is
          # delivered only over stdin, then stored by GitHub CLI's credential helper.
          # shellcheck disable=SC2016 # Sigillo evaluates this command in its child shell.
          sigillo run --project "$SIGILLO_PROJECT_ID" --env "$SIGILLO_ENVIRONMENT" --command 'set -o pipefail; printf "%s" "${GITHUB_API_TOKEN:?GITHUB_API_TOKEN is missing from Sigillo}" | env -u GITHUB_API_TOKEN ./scripts/agent-github.sh install'
          ./scripts/agent-github.sh verify
          {
            echo "### Agent GitHub credential"
            echo
            echo "- Status: **ready**"
            echo "- Credential source: **Sigillo**"
            echo "- Credential values: **not logged**"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Identify Agent cache runtime
        id: cache-runtime
        if: steps.mode.outputs.ready == 'true'
        run: echo "key=$(python3 scripts/lab_environment.py --cache-key)" >> "$GITHUB_OUTPUT"

      - name: Restore Agent Project Cache
        id: project-cache
        if: steps.mode.outputs.ready == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/agent-projects
            ~/.npm
          key: agent-lab-projects-v2-${{ runner.os }}-${{ steps.cache-runtime.outputs.key }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            agent-lab-projects-v2-${{ runner.os }}-${{ steps.cache-runtime.outputs.key }}-

      - name: Restore latest encrypted Agent checkpoint
        if: steps.mode.outputs.ready == 'true'
        env:
          RDC_STATE_KEY: ${{ secrets.RDC_STATE_KEY }}
        run: ./scripts/checkpoint-sync.sh restore

      # RDC is already healthy at this point. Keep the prewarm child in the
      # same long-lived step as keepalive so it cannot be reaped between steps.
      - name: Prewarm Agent Toolchain and Keep RDC Lab Alive
        if: steps.mode.outputs.ready == 'true'
        env:
          RDC_STATE_KEY: ${{ secrets.RDC_STATE_KEY }}
          GH_TOKEN: ${{ secrets.ACTIONS_WATCHDOG_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          SELF_RUN_ID: ${{ github.run_id }}
          REF: ${{ github.ref_name }}
          DISABLED: ${{ vars.RDC_LAB_DISABLED }}
        shell: bash
        run: |
          ./scripts/agent-prewarm.sh --background
          ./scripts/keepalive.sh "$ONLINE_MINUTES"

      # Remove the ephemeral node before any successor is released. The action's
      # post hook repeats logout as a second cleanup layer, but this early step
      # protects normal handoff and cancellation from stale MagicDNS entries.
      - name: Disconnect Tailscale before handoff
        id: tailscale_cleanup
        if: ${{ always() && steps.tailscale.outputs.ready == 'true' }}
        shell: bash
        run: ./scripts/stop-tailscale.sh

      # Same handover model as the proven Tailscale Exit Node: queue the successor
      # while this run still owns the concurrency group.
      - name: Queue Successor Run
        id: handover
        if: ${{ always() && steps.verify.outputs.ready == 'true' && (steps.tailscale.outputs.ready != 'true' || steps.tailscale_cleanup.outcome == 'success') }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.ACTIONS_WATCHDOG_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          SELF_RUN_ID: ${{ github.run_id }}
          REF: ${{ github.ref_name }}
          DISABLED: ${{ vars.RDC_LAB_DISABLED }}
        run: |
          set -uo pipefail
          code=0
          bash .github/scripts/ensure-rdc-lab.sh || code=$?
          if [ "$code" -eq 0 ]; then
            echo "queued=true" >> "$GITHUB_OUTPUT"
          elif [ "$code" -eq 20 ] || [ "$code" -eq 21 ]; then
            echo "queued=true" >> "$GITHUB_OUTPUT"
            echo "Handover intentionally suppressed by repository control (code $code)."
          else
            echo "queued=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Handover was not confirmed (code $code). The relaunch job/watchdog will retry."
          fi

      - name: Save final Agent checkpoint
        if: ${{ always() && steps.verify.outputs.ready == 'true' }}
        env:
          RDC_STATE_KEY: ${{ secrets.RDC_STATE_KEY }}
        run: ./scripts/checkpoint-sync.sh save finalizer

      - name: Upload Agent Checkpoint
        if: ${{ always() && steps.verify.outputs.ready == 'true' }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-checkpoint-${{ github.run_id }}
          path: .agent-artifacts/*.enc
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

      - name: Gracefully Stop RDC
        if: ${{ always() && steps.verify.outputs.ready == 'true' }}
        continue-on-error: true
        run: ./scripts/stop-rdc.sh

      - name: Persist final RDC state
        if: ${{ always() && steps.verify.outputs.ready == 'true' }}
        continue-on-error: true
        env:
          RDC_STATE_KEY: ${{ secrets.RDC_STATE_KEY }}
        run: ./scripts/persist-rdc-state.sh

      - name: Prune retained Agent data
        if: ${{ always() && steps.verify.outputs.ready == 'true' }}
        continue-on-error: true
        run: ./scripts/agent-run.sh cache --apply --days 14

      - name: Save Agent Project Cache
        if: ${{ always() && steps.verify.outputs.ready == 'true' }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/agent-projects
            ~/.npm
          key: agent-lab-projects-v2-${{ runner.os }}-${{ steps.cache-runtime.outputs.key }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Remove optional Agent GitHub token
        if: ${{ always() && steps.verify.outputs.ready == 'true' }}
        continue-on-error: true
        run: ./scripts/agent-github.sh remove

  # Same fallback role as Exit Node's relaunch job.
  relaunch:
    needs: [runner-lab]
    if: ${{ always() && needs.runner-lab.outputs.configured == 'true' && needs.runner-lab.outputs.queued != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Ensure a Successor Exists
        env:
          GH_TOKEN: ${{ secrets.ACTIONS_WATCHDOG_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          WORKFLOW: rdc-lab.yml
          SELF_RUN_ID: ${{ github.run_id }}
          REF: ${{ github.ref_name }}
          DISABLED: ${{ vars.RDC_LAB_DISABLED }}
        shell: bash
        run: |
          code=0
          bash .github/scripts/ensure-rdc-lab.sh || code=$?
          case "$code" in
            0|20|21) exit 0 ;;
            *) exit "$code" ;;
          esac

