name: Remote Desktop Commander Lab

on:
  # Same continuity model as the proven Tailscale Exit Node workflow:
  # self-handover is primary, schedule is only a backstop.
  schedule:
    - cron: '31 */6 * * *'

  workflow_dispatch:

permissions:
  contents: read
  actions: write

env:
  # Leave headroom below the GitHub-hosted job timeout for handover/state save.
  ONLINE_MINUTES: 330

concurrency:
  group: rdc-runner-lab
  cancel-in-progress: false

jobs:
  runner-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    outputs:
      configured: ${{ steps.bootstrap.outputs.ready }}
      queued: ${{ steps.handover.outputs.queued }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'

      - name: Prepare scripts
        run: chmod +x scripts/*.sh .github/scripts/*.sh

      - name: Check RDC bootstrap
        id: bootstrap
        env:
          RDC_DEVICE_STATE_B64: ${{ secrets.RDC_DEVICE_STATE_B64 }}
        shell: bash
        run: |
          if [ -n "$RDC_DEVICE_STATE_B64" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "RDC bootstrap identity is configured."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::RDC bootstrap identity is not configured; persistent lab remains dormant."
          fi

      - name: Restore encrypted rolling RDC state
        if: steps.bootstrap.outputs.ready == 'true'
        uses: actions/cache/restore@v4
        with:
          path: .rdc-state
          key: rdc-state-v1-${{ github.run_id }}
          restore-keys: |
            rdc-state-v1-

      - name: Install Remote Desktop Commander
        if: steps.bootstrap.outputs.ready == 'true'
        run: npm install --global @wonderwhy-er/desktop-commander@0.2.50

      - name: Apply unattended-session hotfix
        if: steps.bootstrap.outputs.ready == 'true'
        run: ./scripts/patch-rdc-refresh.sh

      - name: Restore RDC identity
        if: steps.bootstrap.outputs.ready == 'true'
        env:
          RDC_DEVICE_STATE_B64: ${{ secrets.RDC_DEVICE_STATE_B64 }}
        run: ./scripts/restore-rdc-state.sh

      - name: Start Remote Desktop Commander
        if: steps.bootstrap.outputs.ready == 'true'
        run: ./scripts/start-rdc.sh

      - name: Verify connection
        if: steps.bootstrap.outputs.ready == 'true'
        run: ./scripts/health.sh

      - name: Keep RDC Lab Alive
        if: steps.bootstrap.outputs.ready == 'true'
        env:
          RDC_DEVICE_STATE_B64: ${{ secrets.RDC_DEVICE_STATE_B64 }}
        run: ./scripts/keepalive.sh "$ONLINE_MINUTES"

      # Exact handover idea used by the Exit Node: pre-queue the successor while
      # this run still owns the concurrency group. The replacement can only start
      # after this run releases the group.
      - name: Queue Successor Run
        id: handover
        if: ${{ always() && steps.bootstrap.outputs.ready == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.ACTIONS_WATCHDOG_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          SELF_RUN_ID: ${{ github.run_id }}
          REF: ${{ github.ref_name }}
          DISABLED: ${{ vars.RDC_LAB_DISABLED }}
        run: |
          set -uo pipefail
          if bash .github/scripts/ensure-rdc-lab.sh; then
            echo "queued=true" >> "$GITHUB_OUTPUT"
          else
            echo "queued=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Handover failed. The relaunch job/watchdog will retry."
          fi

      - name: Gracefully Stop RDC
        if: ${{ always() && steps.bootstrap.outputs.ready == 'true' }}
        continue-on-error: true
        run: ./scripts/stop-rdc.sh

      - name: Save Final Encrypted RDC State
        if: ${{ always() && steps.bootstrap.outputs.ready == 'true' }}
        continue-on-error: true
        env:
          RDC_DEVICE_STATE_B64: ${{ secrets.RDC_DEVICE_STATE_B64 }}
        run: ./scripts/save-rdc-state.sh

      - name: Persist Rolling State for Successor
        if: ${{ always() && steps.bootstrap.outputs.ready == 'true' && hashFiles('.rdc-state/device.json.enc') != '' }}
        uses: actions/cache/save@v4
        with:
          path: .rdc-state
          key: rdc-state-v1-${{ github.run_id }}

  # Same fallback role as the Exit Node relaunch job. It is skipped when the
  # pre-queued successor already exists, so normal handover has no extra delay.
  relaunch:
    needs: [runner-lab]
    if: ${{ always() && needs.runner-lab.outputs.configured == 'true' && needs.runner-lab.outputs.queued != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure a Successor Exists
        env:
          GH_TOKEN: ${{ secrets.ACTIONS_WATCHDOG_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          WORKFLOW: rdc-lab.yml
          SELF_RUN_ID: ${{ github.run_id }}
          REF: ${{ github.ref_name }}
          DISABLED: ${{ vars.RDC_LAB_DISABLED }}
        run: bash .github/scripts/ensure-rdc-lab.sh
