name: RDC Lab Watchdog

on:
  workflow_run:
    workflows: [Remote Desktop Commander Lab]
    types: [requested, in_progress, completed]

  schedule:
    - cron: '*/10 * * * *'

  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: rdc-runner-lab-watchdog
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Check persistent RDC state
        id: state
        env:
          RDC_STATE_KEY: ${{ secrets.RDC_STATE_KEY }}
        shell: bash
        run: |
          if [ ${#RDC_STATE_KEY} -lt 32 ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::RDC_STATE_KEY is not configured; watchdog remains dormant."
            exit 0
          fi

          if git ls-remote --exit-code origin refs/heads/rdc-state >/dev/null 2>&1; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Persistent RDC state exists."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No RDC account is connected yet. Run Remote Desktop Commander Lab once with Start / Resume."
          fi

      - name: Ensure RDC Lab is running
        if: steps.state.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.ACTIONS_WATCHDOG_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          WORKFLOW: rdc-lab.yml
          REF: main
          DISABLED: ${{ vars.RDC_LAB_DISABLED }}
        run: bash .github/scripts/ensure-rdc-lab.sh

      - name: Report State
        if: always()
        env:
          GH_TOKEN: ${{ secrets.ACTIONS_WATCHDOG_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          STATE_READY: ${{ steps.state.outputs.ready }}
          DISABLED: ${{ vars.RDC_LAB_DISABLED }}
        shell: bash
        run: |
          set -uo pipefail
          RUNS="$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/actions/workflows/rdc-lab.yml/runs?per_page=5" \
            2>/dev/null || true)"
          {
            echo "### RDC Runner Lab"
            echo
            case "${DISABLED,,}" in
              true|1|yes) echo "Kill switch \`RDC_LAB_DISABLED\` is **on**. The lab will not restart." ; echo ;;
            esac
            if [ "$STATE_READY" != "true" ]; then
              echo "Persistent RDC state is not initialized yet; automatic relaunch is intentionally dormant."
              echo
            fi
            if [ -z "$RUNS" ]; then
              echo "GitHub API unavailable; state unknown."
            else
              echo "| Run | Status | Conclusion | Started |"
              echo "| --- | ------ | ---------- | ------- |"
              jq -r '.workflow_runs[] | "| [\(.id)](\(.html_url)) | \(.status) | \(.conclusion // "-") | \(.run_started_at // .created_at) |"' <<<"$RUNS"
            fi
          } >> "$GITHUB_STEP_SUMMARY"


      - name: Publish README Runner Status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'main' }}
        run: python3 .github/scripts/readme-status.py --publish
