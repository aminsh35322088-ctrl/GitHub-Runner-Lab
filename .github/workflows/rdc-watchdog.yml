name: RDC Lab Watchdog

on:
  workflow_run:
    workflows: [Remote Desktop Commander Lab]
    types: [completed]
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: rdc-runner-lab-watchdog
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check RDC bootstrap
        id: bootstrap
        env:
          RDC_DEVICE_STATE_B64: ${{ secrets.RDC_DEVICE_STATE_B64 }}
        shell: bash
        run: |
          if [ -n "$RDC_DEVICE_STATE_B64" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::RDC bootstrap identity is not configured; watchdog remains dormant."
          fi

      - name: Ensure RDC Lab is running
        if: steps.bootstrap.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WORKFLOW: rdc-lab.yml
          REF: main
          DISABLED: ${{ vars.RDC_LAB_DISABLED }}
        run: bash .github/scripts/ensure-rdc-lab.sh

      - name: Report state
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BOOTSTRAP_READY: ${{ steps.bootstrap.outputs.ready }}
        shell: bash
        run: |
          set -uo pipefail
          RUNS="$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/actions/workflows/rdc-lab.yml/runs?per_page=5" \
            2>/dev/null || true)"
          {
            echo "### RDC Runner Lab"
            echo
            if [ "$BOOTSTRAP_READY" != "true" ]; then
              echo "Bootstrap identity is not configured; automatic relaunch is intentionally dormant."
              echo
            fi
            if [ -z "$RUNS" ]; then
              echo "GitHub API unavailable; state unknown."
            else
              echo "| Run | Status | Conclusion | Started |"
              echo "| --- | ------ | ---------- | ------- |"
              jq -r '.workflow_runs[] | "| [\(.id)](\(.html_url)) | \(.status) | \(.conclusion // "-") | \(.run_started_at // .created_at) |"' <<<"$RUNS"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
